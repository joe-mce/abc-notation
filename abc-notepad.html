<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ABC Notepad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.4.4/abcjs-basic-min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #333;
    --accent: #e8c84a;
    --accent2: #4ae8b4;
    --text: #f0ede6;
    --text-dim: #888;
    --btn-bg: #222;
    --btn-bg-lg: #2a2a1a;
    --btn-border: #3a3a3a;
    --btn-border-lg: #5a5020;
    --radius: 8px;
    --radius-sm: 5px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 10px;
    gap: 7px;
    max-width: 640px;
    margin: 0 auto;
  }

  header {
    padding: 2px 0 2px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }

  .btn-settings {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: var(--radius-sm);
    padding: 5px 10px;
    font-size: 0.75rem;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.04em;
    touch-action: manipulation;
  }
  .btn-settings.active { border-color: var(--accent); color: var(--accent); }
  .header-btns { display: flex; gap: 6px; }

  /* Zoom panel */
  #zoom-panel {
    display: none;
    position: absolute;
    top: 32px;
    right: 10px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 2px 10px 10px;
    z-index: 50;
    width: 160px;
  }
  #zoom-panel.open { display: block; }
  #zoom-slider {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
    height: 4px;
  }

  /* Settings modal */
  #settings-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #settings-overlay.open { display: flex; }
  #modal-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    width: 100%;
    max-width: 500px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--accent);
  }
  .modal-close {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 2px 6px;
    line-height: 1;
    touch-action: manipulation;
  }
  .modal-setting {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .modal-setting-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-setting-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .modal-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }
  .modal-toggle input[type="checkbox"] {
    accent-color: var(--accent);
    width: 16px;
    height: 16px;
    cursor: pointer;
  }
  .modal-wrap-fields {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .modal-wrap-fields.disabled { opacity: 0.4; pointer-events: none; }
  .modal-field-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
  }
  .modal-textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    line-height: 1.5;
    padding: 7px 9px;
    resize: vertical;
    min-height: 56px;
  }
  .modal-textarea:focus { outline: none; border-color: var(--accent); }

  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 1rem;
    color: var(--accent);
    letter-spacing: 0.05em;
  }
  .logo { text-decoration: none; }
  .logo span { color: var(--text-dim); font-weight: 400; }

  /* Preview */
  #preview-wrap { overflow: hidden; min-height: 120px; }
  #preview { padding: 8px 10px; overflow-x: auto; overflow-y: hidden; }
  #preview svg { display: block; }
  #preview svg path, #preview svg rect, #preview svg ellipse,
  #preview svg polygon, #preview svg line, #preview svg polyline {
    fill: var(--text); stroke: var(--text);
  }
  #preview svg [fill="none"] { fill: none; }
  #preview svg [stroke="none"] { stroke: none; }
  #preview svg .mark path,
  #preview svg .mark rect,
  #preview svg .mark ellipse,
  #preview svg .mark polygon,
  #preview svg .mark line {
    fill: var(--accent) !important;
    stroke: var(--accent) !important;
  }

  /* Editor */
  .editor-wrap {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
  }
  #notation {
    border-radius: var(--radius) var(--radius) 0 0;
  }
  #notation {
    width: 100%;
    min-height: 90px;
    max-height: 160px;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
    line-height: 1.6;
    padding: 10px 12px;
    resize: vertical;
    caret-color: var(--accent);
  }
  #notation::placeholder { color: var(--text-dim); }

  .editor-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 8px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    gap: 6px;
  }
  .footer-left { display: flex; gap: 6px; }
  .footer-right { display: flex; gap: 6px; }

  .action-btn {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    transition: background 0.08s, transform 0.08s;
    letter-spacing: 0.04em;
    touch-action: manipulation;
  }
  .btn-copy { background: var(--accent); color: #111; }
  .btn-clear { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-templates { background: transparent; color: var(--accent2); border: 1px solid #2a5a4a; }
  .btn-templates.active { background: #0a2a1f; border-color: var(--accent2); }

  .arrow-btns { display: flex; gap: 3px; }
  .btn-arrow {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: var(--radius-sm);
    padding: 5px 8px;
    font-size: 0.7rem;
    cursor: pointer;
    touch-action: manipulation;
    font-family: 'IBM Plex Sans', sans-serif;
    line-height: 1;
  }

  /* Split copy button */
  .copy-split {
    display: flex;
    position: relative;
  }
  .copy-split .btn-copy-main {
    background: var(--accent);
    color: #111;
    border: none;
    border-radius: var(--radius-sm) 0 0 var(--radius-sm);
    padding: 5px 12px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    touch-action: manipulation;
  }
  .copy-split-divider {
    width: 1px;
    background: rgba(0,0,0,0.25);
    flex-shrink: 0;
  }
  .copy-split .btn-copy-arrow {
    background: var(--accent);
    color: #111;
    border: none;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 5px 7px;
    font-size: 0.6rem;
    cursor: pointer;
    touch-action: manipulation;
    display: flex;
    align-items: center;
  }
  .copy-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    z-index: 50;
    white-space: nowrap;
    min-width: 100%;
  }
  .copy-dropdown.open { display: block; }
  .copy-dropdown-item {
    display: block;
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 8px 14px;
    text-align: left;
    cursor: pointer;
    letter-spacing: 0.04em;
    touch-action: manipulation;
  }
  .copy-dropdown-item:hover { background: var(--surface2); }

  /* Template panel */
  #tmpl-panel {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.22s ease, padding 0.22s ease, border-width 0.22s ease;
    padding: 0 8px;
    border-width: 0;
  }
  #tmpl-panel.open { max-height: 300px; padding: 8px; border-width: 1.5px; }
  .tmpl-grid { display: flex; flex-wrap: wrap; gap: 5px; }
  .tmpl-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(0.65rem, 2.4vw, 0.8rem);
    font-weight: 600;
    background: var(--btn-bg);
    color: var(--accent2);
    border: 1.5px solid #2a5a4a;
    border-radius: var(--radius-sm);
    padding: 7px 10px;
    cursor: pointer;
    transition: background 0.08s, transform 0.08s;
    white-space: nowrap;
    touch-action: manipulation;
  }

  .copy-toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-60px);
    background: var(--accent2);
    color: #0a2a1f;
    font-weight: 600;
    font-size: 0.8rem;
    padding: 8px 20px;
    border-radius: 20px;
    transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 999;
    white-space: nowrap;
  }
  .copy-toast.show { transform: translateX(-50%) translateY(0); }

  /* Key rows */
  .key-row {
    display: flex;
    flex-wrap: nowrap;
    gap: 4px;
    width: 100%;
  }
  .key {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    border: 1.5px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--text);
    border-radius: var(--radius-sm);
    cursor: pointer;
    user-select: none;
    transition: background 0.08s, transform 0.08s;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    flex: 1 1 0;
    min-width: 0;
    padding: 0;
    white-space: nowrap;
    overflow: hidden;
    touch-action: manipulation;
  }
  @keyframes keyflash {
    0%   { background: #556; transform: scale(0.88); }
    40%  { background: #445; }
    100% { background: var(--btn-bg); transform: scale(1); }
  }
  @keyframes keyflash-primary {
    0%   { background: #4a4520; transform: scale(0.88); }
    40%  { background: #3a3518; }
    100% { background: var(--btn-bg-lg); transform: scale(1); }
  }
  @keyframes keyflash-bksp {
    0%   { background: #3a1515; transform: scale(0.88); }
    100% { background: #1e1010; transform: scale(1); }
  }
  @keyframes btnflash {
    0%   { opacity: 0.6; transform: scale(0.94); }
    100% { opacity: 1;   transform: scale(1); }
  }
  @keyframes tmplflash {
    0%   { background: #0d3d2a; transform: scale(0.92); }
    100% { background: var(--btn-bg); transform: scale(1); }
  }
  .key.flash               { animation: keyflash 0.25s cubic-bezier(0.2, 0, 0.4, 1); }
  .row-primary .key.flash  { animation: keyflash-primary 0.25s cubic-bezier(0.2, 0, 0.4, 1); }
  .key-bksp.flash          { animation: keyflash-bksp 0.25s cubic-bezier(0.2, 0, 0.4, 1) !important; }
  .tmpl-btn.flash          { animation: tmplflash 0.25s cubic-bezier(0.2, 0, 0.4, 1); }
  .action-btn.flash        { animation: btnflash 0.2s cubic-bezier(0.2, 0, 0.4, 1); }

  .row-primary .key {
    height: 48px;
    font-size: clamp(0.85rem, 3.2vw, 1.2rem);
    border-color: var(--btn-border-lg);
    background: var(--btn-bg-lg);
    color: var(--accent);
  }
  .key-bksp {
    flex: 1.4 1 0 !important;
    background: #1e1010 !important;
    border-color: #4a2020 !important;
    color: #e06060 !important;
    font-size: clamp(0.85rem, 3vw, 1rem) !important;
  }
  .row-notes .key { height: 42px; font-size: clamp(0.8rem, 2.8vw, 1rem); }
  .key-z { color: var(--accent2) !important; }
  .key-space {
    flex: 4 1 0 !important;
    font-size: clamp(0.55rem, 2vw, 0.7rem) !important;
    letter-spacing: 0.06em;
    color: var(--text-dim) !important;
  }
  .key-nl {
    flex: 1.5 1 0 !important;
    font-size: clamp(0.6rem, 2.2vw, 0.75rem) !important;
    color: var(--text-dim) !important;
  }
  .row-small .key { height: 36px; font-size: clamp(0.7rem, 2.6vw, 0.9rem); color: var(--text-dim); }
</style>
</head>
<body>

<header>
  <a href="#" class="logo">ABC <span>Notepad</span></a>
  <div class="header-btns">
    <button class="btn-settings action-btn" id="zoomToggle" data-action="toggleZoom">Zoom</button>
    <button class="btn-settings action-btn" id="modalSettingsBtn" data-action="openSettings">Settings</button>
  </div>
  <div id="zoom-panel">
    <input type="range" id="zoom-slider" min="0" max="1" step="0.01" value="0.5">
  </div>
</header>

<!-- Clear confirm modal -->
<div id="clear-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; padding:20px;">
  <div style="background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:18px; width:100%; max-width:280px; display:flex; flex-direction:column; gap:14px;">
    <div style="font-family:'IBM Plex Mono',monospace; font-size:0.9rem; color:var(--text);">Clear all text?</div>
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button class="action-btn btn-clear" data-action="clearCancel">Cancel</button>
      <button class="action-btn btn-clear" style="color:#e06060;" data-action="clearStep2">Clear</button>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div id="settings-overlay">
  <div id="modal-box">
    <div class="modal-header">
      <span class="modal-title">Settings</span>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-setting">
      <div class="modal-setting-header">
        <span class="modal-setting-label">Wrap output</span>
      </div>
      <div class="modal-wrap-fields" id="wrapFields">
        <span class="modal-field-label">Before</span>
        <textarea class="modal-textarea" id="wrapBefore" rows="3">```abc
{"staffwidth": 500}
---</textarea>
        <span class="modal-field-label">After</span>
        <textarea class="modal-textarea" id="wrapAfter" rows="1">```</textarea>
      </div>
    </div>
  </div>
</div>

<div id="preview-wrap">
  <div id="preview"></div>
</div>

<div class="editor-wrap">
  <textarea id="notation" placeholder="Type or tap to enter ABC notation…"
    autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
  <div class="editor-footer">
    <div class="footer-left">
      <button class="action-btn btn-templates" id="tmplToggle" data-action="toggleTemplates" data-keepfocus="1">&#9776;</button>
      <div class="arrow-btns">
        <button class="btn-arrow action-btn" data-action="arrowLeft" data-keepfocus="1" style="font-family:'IBM Plex Mono',monospace;font-style:normal;">&#x2190;</button>
        <!--
        <button class="btn-arrow action-btn" data-action="arrowUp" data-keepfocus="1">&#x2191;</button>
        <button class="btn-arrow action-btn" data-action="arrowDown" data-keepfocus="1">&#x2193;</button>
        -->
        <button class="btn-arrow action-btn" data-action="arrowRight" data-keepfocus="1" style="font-family:'IBM Plex Mono',monospace;font-style:normal;">&#x2192;</button>
      </div>
    </div>
    <div class="footer-right">
      <button class="action-btn btn-clear" id="clearBtn" data-action="clearStep1">Clear</button>
      <div class="copy-split">
        <button class="btn-copy-main action-btn" data-action="copyText">Copy</button>
        <div class="copy-split-divider"></div>
        <button class="btn-copy-arrow action-btn" id="copyArrow" data-action="toggleCopyDropdown">▾</button>
        <div class="copy-dropdown" id="copyDropdown">
          <button class="copy-dropdown-item action-btn" data-action="copyTextRaw">Copy without wrapping</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="tmpl-panel">
  <div class="tmpl-grid">
    <button class="tmpl-btn" data-insert="%%score ">%%score</button>
    <button class="tmpl-btn" data-insert="%%score {1 | 2}">%%score {1|2}</button>
    <button class="tmpl-btn" data-insert="%%score {(1 2) | (3 4)}">%%score {(1 2)|(3 4)}</button>
    <button class="tmpl-btn" data-insert="T:">T:</button>
    <button class="tmpl-btn" data-insert="V:">V:</button>
    <button class="tmpl-btn" data-insert="L:">L:</button>
    <button class="tmpl-btn" data-insert="W:">W:</button>
    <button class="tmpl-btn" data-insert="clef=treble ">clef=treble</button>
    <button class="tmpl-btn" data-insert="clef=bass ">clef=bass</button>
    <button class="tmpl-btn" data-insert="style=">style=</button>
    <button class="tmpl-btn" data-insert="[V:1]">[V:1]</button>
    <button class="tmpl-btn" data-insert="[V:2]">[V:2]</button>
    <button class="tmpl-btn" data-insert="(3">(3</button>
    <button class="tmpl-btn" data-insert="!mark!">!mark!</button>
    <button class="tmpl-btn" data-insert="%%score {1 | 2}&#10;V:1 clef=treble&#10;V:2 clef=bass&#10;[V:1]&#10;[V:2]">Grand Staff</button>
    <button class="tmpl-btn" data-insert="%%staffsep 25&#10;K:perc stafflines=0&#10;L:3/2&#10;z z | z z | z z | z z |">Chord Chart</button>
  </div>
</div>

<!-- Row 1: _ ^ = [ ] ( ) " . ⌫ -->
<div class="key-row row-primary">
  <button class="key" data-insert="_">_</button>
  <button class="key" data-insert="^">^</button>
  <button class="key" data-insert="=">=</button>
  <button class="key" data-insert="[">&#91;</button>
  <button class="key" data-insert="]">&#93;</button>
  <button class="key" data-insert="(">&#40;</button>
  <button class="key" data-insert=")">&#41;</button>
  <button class="key" data-insert="&quot;">&quot;</button>
  <button class="key" data-insert=".">.</button>
  <button class="key key-bksp" data-action="bksp">⌫</button>
</div>

<!-- Row 2: c d e f g a b ' z -->
<div class="key-row row-notes">
  <button class="key" data-insert="c">c</button>
  <button class="key" data-insert="d">d</button>
  <button class="key" data-insert="e">e</button>
  <button class="key" data-insert="f">f</button>
  <button class="key" data-insert="g">g</button>
  <button class="key" data-insert="a">a</button>
  <button class="key" data-insert="b">b</button>
  <button class="key" data-insert="'">'</button>
  <button class="key key-z" data-insert="z">z</button>
</div>

<!-- Row 3: C D E F G A B , / -->
<div class="key-row row-notes">
  <button class="key" data-insert="C">C</button>
  <button class="key" data-insert="D">D</button>
  <button class="key" data-insert="E">E</button>
  <button class="key" data-insert="F">F</button>
  <button class="key" data-insert="G">G</button>
  <button class="key" data-insert="A">A</button>
  <button class="key" data-insert="B">B</button>
  <button class="key" data-insert=","><span style="font-size:1.4em;line-height:1">,</span></button>
  <button class="key" data-insert="/">/</button>
</div>

<!-- Row 4: 0-9 -->
<div class="key-row row-small">
  <button class="key" data-insert="0">0</button>
  <button class="key" data-insert="1">1</button>
  <button class="key" data-insert="2">2</button>
  <button class="key" data-insert="3">3</button>
  <button class="key" data-insert="4">4</button>
  <button class="key" data-insert="5">5</button>
  <button class="key" data-insert="6">6</button>
  <button class="key" data-insert="7">7</button>
  <button class="key" data-insert="8">8</button>
  <button class="key" data-insert="9">9</button>
</div>

<!-- Row 5: - SPACE | ↵ -->
<div class="key-row row-notes">
  <button class="key" data-insert="-">-</button>
  <button class="key key-space" data-insert=" ">SPACE</button>
  <button class="key" data-insert="|">|</button>
  <button class="key key-nl" data-insert="&#10;">↵</button>
</div>

<div class="copy-toast" id="toast">Copied ✓</div>

<script>
  const ta = document.getElementById('notation');
  const toast = document.getElementById('toast');
  const previewDiv = document.getElementById('preview');

  let taFocused = false;
  let savedStart = 0, savedEnd = 0;
  let debounceTimer = null;

  ta.addEventListener('focus', () => { taFocused = true; });
  ta.addEventListener('blur', () => {
    taFocused = false;
    savedStart = ta.selectionStart;
    savedEnd = ta.selectionEnd;
  });
  ta.addEventListener('keyup', () => {
    if (taFocused) { savedStart = ta.selectionStart; savedEnd = ta.selectionEnd; }
  });
  ta.addEventListener('click', () => {
    if (taFocused) { savedStart = ta.selectionStart; savedEnd = ta.selectionEnd; }
  });
  document.addEventListener('selectionchange', () => {
    if (taFocused) { savedStart = ta.selectionStart; savedEnd = ta.selectionEnd; }
  });
  const clearBtn = document.getElementById('clearBtn');
  function updateClearBtn() {
    clearBtn.style.visibility = ta.value ? '' : 'hidden';
  }
  updateClearBtn();

  ta.addEventListener('input', () => { schedulePreview(); updateClearBtn(); });

  const zoomSlider = document.getElementById('zoom-slider');
  let zoomLevel = 0.5;

  const BASE_MULTIPLIER = 1.45;
  const SCALING_FACTOR = 1.4;

  function getStaffwidth() {
    const containerWidth = previewDiv.offsetWidth || 320;
    const multiplier = BASE_MULTIPLIER - (zoomLevel - 0.5) * SCALING_FACTOR;
    return Math.round(containerWidth * multiplier);
  }

  zoomSlider.addEventListener('input', () => {
    zoomLevel = parseFloat(zoomSlider.value);
    renderPreview();
  });

  function schedulePreview() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(renderPreview, 900);
  }

  function renderPreview() {
    const raw = ta.value.trim();
    if (!raw) { previewDiv.innerHTML = ''; return; }
    try {
      ABCJS.renderAbc('preview', raw, {
        responsive: 'resize',
        staffwidth: getStaffwidth(),
        add_classes: true,
        paddingtop: 6, paddingbottom: 6, paddingleft: 8, paddingright: 8,
        jazzchords: false,
        format: { gchordfont: 'Helvetica 12' }
      });
    } catch(e) {}
  }

  // Core insert — used by both key buttons and template buttons
  function doInsert(text, refocus) {
    const s = savedStart;
    const e = savedEnd;
    const atEnd = e === ta.value.length;
    ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
    savedStart = s + text.length;
    savedEnd = savedStart;
    if (refocus) {
      ta.focus();
      ta.setSelectionRange(savedStart, savedEnd);
    }
    if (atEnd) ta.scrollTop = ta.scrollHeight;
    updateClearBtn();
    schedulePreview();
  }

  function bksp() {
    const wasActive = taFocused;
    const atEnd = savedEnd === ta.value.length;
    if (savedStart === savedEnd && savedStart > 0) {
      ta.value = ta.value.slice(0, savedStart - 1) + ta.value.slice(savedEnd);
      savedStart -= 1; savedEnd = savedStart;
    } else if (savedStart !== savedEnd) {
      ta.value = ta.value.slice(0, savedStart) + ta.value.slice(savedEnd);
      savedEnd = savedStart;
    }
    if (wasActive) { ta.focus(); ta.setSelectionRange(savedStart, savedEnd); }
    if (atEnd) ta.scrollTop = ta.scrollHeight;
    updateClearBtn();
    schedulePreview();
  }

  function moveCursor(key) {
    const wasFocused = taFocused;
    const s = savedStart;
    const val = ta.value;
    let pos;
    if (key === 'ArrowLeft') {
      pos = s > 0 ? s - 1 : 0;
    } else if (key === 'ArrowRight') {
      pos = s < val.length ? s + 1 : val.length;
    } else {
      const lines = val.split('\n');
      let line = 0, col = 0, count = 0;
      for (let i = 0; i < lines.length; i++) {
        if (count + lines[i].length >= s) { line = i; col = s - count; break; }
        count += lines[i].length + 1;
      }
      if (key === 'ArrowUp') {
        pos = line === 0 ? 0 : lines.slice(0, line - 1).reduce((a, l) => a + l.length + 1, 0) + Math.min(col, lines[line - 1].length);
      } else {
        pos = line === lines.length - 1 ? val.length : lines.slice(0, line + 1).reduce((a, l) => a + l.length + 1, 0) + Math.min(col, lines[line + 1].length);
      }
    }
    savedStart = pos; savedEnd = pos;
    if (wasFocused) ta.setSelectionRange(pos, pos);
  }

  function arrowLeft()  { moveCursor('ArrowLeft');  }
  function arrowRight() { moveCursor('ArrowRight'); }
  function arrowUp()    { moveCursor('ArrowUp');    }
  function arrowDown()  { moveCursor('ArrowDown');  }

  function toggleTemplates() {
    const panel = document.getElementById('tmpl-panel');
    const btn = document.getElementById('tmplToggle');
    const isOpen = panel.classList.toggle('open');
    btn.classList.toggle('active', isOpen);
  }

  function closeTemplates() {
    const panel = document.getElementById('tmpl-panel');
    const btn = document.getElementById('tmplToggle');
    panel.classList.remove('open');
    btn.classList.remove('active');
  }

  function copyText() {
    closeCopyDropdown();
    const before = document.getElementById('wrapBefore').value;
    const after = document.getElementById('wrapAfter').value;
    const text = before + '\n' + ta.value + '\n' + after;
    navigator.clipboard.writeText(text).then(showToast).catch(() => {
      try { document.execCommand('copy'); showToast(); } catch(e) {}
    });
  }

  function copyTextRaw() {
    navigator.clipboard.writeText(ta.value).then(showToast).catch(() => {
      try { document.execCommand('copy'); showToast(); } catch(e) {}
    });
    closeCopyDropdown();
  }

  function toggleCopyDropdown() {
    document.getElementById('copyDropdown').classList.toggle('open');
  }

  function closeCopyDropdown() {
    document.getElementById('copyDropdown').classList.remove('open');
  }

  document.addEventListener('mousedown', e => {
    if (!e.target.closest('.copy-split')) closeCopyDropdown();
  });
  document.addEventListener('touchstart', e => {
    if (!e.target.closest('.copy-split')) closeCopyDropdown();
  }, { passive: true });

  function showToast() {
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function clearStep1() {
    if (!ta.value) return;
    activeBtn = null; // allow modal buttons to get fresh touch events
    const overlay = document.getElementById('clear-overlay');
    overlay.style.display = 'flex';
    overlay.onclick = e => { if (e.target === overlay) clearCancel(); };
  }

  function clearStep2() {
    ta.value = ''; savedStart = 0; savedEnd = 0;
    previewDiv.innerHTML = '';
    previewDiv.removeAttribute('style');
    clearTimeout(debounceTimer);
    updateClearBtn();
    clearCancel();
  }

  function clearCancel() {
    document.getElementById('clear-overlay').style.display = 'none';
  }

  function toggleZoom() {
    const panel = document.getElementById('zoom-panel');
    const btn = document.getElementById('zoomToggle');
    const isOpen = panel.classList.toggle('open');
    btn.classList.toggle('active', isOpen);
  }

  function openSettings() {
    document.getElementById('settings-overlay').classList.add('open');
  }

  function closeSettings() {
    document.getElementById('settings-overlay').classList.remove('open');
  }

  // Modal close button and overlay click
  document.getElementById('modalClose').addEventListener('click', closeSettings);
  document.getElementById('settings-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('settings-overlay')) closeSettings();
  });

  // Close zoom panel when clicking outside
  document.addEventListener('mousedown', e => {
    if (!e.target.closest('#zoom-panel') && !e.target.closest('#zoomToggle')) {
      document.getElementById('zoom-panel').classList.remove('open');
      document.getElementById('zoomToggle').classList.remove('active');
    }
  });
  document.addEventListener('touchstart', e => {
    if (!e.target.closest('#zoom-panel') && !e.target.closest('#zoomToggle')) {
      document.getElementById('zoom-panel').classList.remove('open');
      document.getElementById('zoomToggle').classList.remove('active');
    }
  }, { passive: true });

  document.getElementById('wrapBefore').value = "```abc\n{\"staffwidth\": 500}\n---";
  document.getElementById('wrapAfter').value = "```";

  // Unified button interaction — works for both touch and mouse
  const actions = { toggleTemplates, toggleZoom, openSettings, copyText, copyTextRaw, toggleCopyDropdown, clearStep1, clearStep2, clearCancel, bksp, arrowLeft, arrowRight, arrowUp, arrowDown };

  const releaseActions = new Set(['copyText', 'copyTextRaw', 'toggleCopyDropdown', 'toggleTemplates', 'toggleZoom', 'openSettings', 'clearStep1', 'clearStep2', 'clearCancel']);

  function handleButtonPress(btn) {
    // Release-action buttons animate on release, not press
    if (!releaseActions.has(btn.dataset.action)) {
      btn.classList.remove('flash');
      void btn.offsetWidth;
      btn.classList.add('flash');
    }
    if (releaseActions.has(btn.dataset.action)) return;
    // Fire all other actions immediately on press
    if (btn.dataset.action) {
      const fn = actions[btn.dataset.action];
      if (fn) fn();
    } else if (btn.dataset.insert !== undefined) {
      const isKey = btn.classList.contains('key');
      if (btn.classList.contains('tmpl-btn')) {
        closeTemplates();
        doInsert(btn.dataset.insert, taFocused);
      } else {
        doInsert(btn.dataset.insert, isKey && taFocused);
      }
    }
  }

  function handleButtonRelease(btn) {
    if (btn.dataset.action && releaseActions.has(btn.dataset.action)) {
      btn.classList.remove('flash');
      void btn.offsetWidth;
      btn.classList.add('flash');
      const fn = actions[btn.dataset.action];
      if (fn) fn();
    }
  }

  // Touch handling — press on touchstart, fire on touchend
  let activeBtn = null;
  document.addEventListener('touchstart', e => {
    const btn = e.target.closest('.key, .tmpl-btn, .action-btn');
    if (!btn) return;
    if (btn.classList.contains('key') || btn.classList.contains('tmpl-btn')) {
      e.preventDefault();
    } else if (btn.dataset.keepfocus) {
      // For arrow/keepfocus buttons: don't preventDefault (avoids iOS scroll jump)
      // but immediately refocus the textarea if it was focused
      if (taFocused) ta.focus();
    }
    activeBtn = btn;
    handleButtonPress(btn);
  }, { passive: false });

  document.addEventListener('touchend', e => {
    if (!activeBtn) return;
    const touch = e.changedTouches[0];
    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    if (target && activeBtn.contains(target)) handleButtonRelease(activeBtn);
    activeBtn = null;
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchcancel', e => {
    activeBtn = null;
  }, { passive: true });

  // Mouse handling for desktop — single document-level listener so mouseup always fires
  let activeMouseBtn = null;

  document.addEventListener('mousedown', e => {
    const btn = e.target.closest('.key, .tmpl-btn, .action-btn');
    if (!btn) return;
    if (btn.classList.contains('key') || btn.classList.contains('tmpl-btn') || btn.dataset.keepfocus) {
      e.preventDefault(); // prevent textarea blur
    }
    activeMouseBtn = btn;
    handleButtonPress(btn);
  });

  document.addEventListener('mouseup', e => {
    if (!activeMouseBtn) return;
    const btn = activeMouseBtn;
    activeMouseBtn = null;
    if (btn.contains(e.target)) handleButtonRelease(btn);
  });
</script>
</body>
</html>
