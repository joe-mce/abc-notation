<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ABC Notepad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.4.4/abcjs-basic-min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #333;
    --accent: #e8c84a;
    --accent2: #4ae8b4;
    --text: #f0ede6;
    --text-dim: #888;
    --btn-bg: #222;
    --btn-bg-lg: #2a2a1a;
    --btn-border: #3a3a3a;
    --btn-border-lg: #5a5020;
    --radius: 8px;
    --radius-sm: 5px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 10px;
    gap: 7px;
    max-width: 640px;
    margin: 0 auto;
  }

  header {
    padding: 2px 0 2px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }

  .btn-settings {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: var(--radius-sm);
    padding: 5px 10px;
    font-size: 0.75rem;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.04em;
    touch-action: manipulation;
  }
  .btn-settings.active { border-color: var(--accent); color: var(--accent); }
  .header-btns { display: flex; gap: 6px; }

  /* Zoom panel */
  #zoom-panel {
    display: none;
    position: absolute;
    top: 32px;
    right: 10px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 2px 10px 10px;
    z-index: 50;
    width: 160px;
  }
  #zoom-panel.open { display: block; }
  #zoom-slider {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
    height: 4px;
  }

  /* Settings modal */
  #settings-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #settings-overlay.open { display: flex; }
  #modal-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    width: 100%;
    max-width: 500px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--accent);
  }
  .modal-close {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 2px 6px;
    line-height: 1;
    touch-action: manipulation;
  }
  .modal-setting {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .modal-setting-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-setting-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .modal-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }
  .modal-toggle input[type="checkbox"] {
    accent-color: var(--accent);
    width: 16px;
    height: 16px;
    cursor: pointer;
  }
  .modal-wrap-fields {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .modal-wrap-fields.disabled { opacity: 0.4; pointer-events: none; }
  .modal-field-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
  }
  .modal-textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    line-height: 1.5;
    padding: 7px 9px;
    resize: vertical;
    min-height: 56px;
  }
  .modal-textarea:focus { outline: none; border-color: var(--accent); }

  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 1rem;
    color: var(--accent);
    letter-spacing: 0.05em;
  }
  .logo { text-decoration: none; }
  .logo span { color: var(--text-dim); font-weight: 400; }

  /* Static cursor in editor display view */
  .editor-cursor {
    display: inline-block;
    width: 2px;
    background: var(--accent);
    border-radius: 1px;
    margin: 0 -1px;
    vertical-align: text-bottom;
    height: 1.15em;
    position: relative;
    top: 0.07em;
  }

  /* Static editor display (shown when textarea is unfocused) */
  #notation-display {
    display: none;
    width: 100%;
    min-height: 90px;
    max-height: 160px;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
    line-height: 1.6;
    padding: 10px 12px;
    box-sizing: border-box;
    white-space: pre-wrap;
    word-break: break-all;
    overflow-y: auto;
    cursor: text;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  #notation-display.active { display: block; }
  #notation-display .display-placeholder { color: var(--text-dim); }
  #notation.hidden { display: none; }

  /* Preview */
  #preview-wrap { overflow: hidden; min-height: 120px; }
  #preview { padding: 8px 10px; overflow-x: auto; overflow-y: hidden; }
  #preview svg { display: block; }
  #preview svg path, #preview svg rect, #preview svg ellipse,
  #preview svg polygon, #preview svg line, #preview svg polyline {
    fill: var(--text); stroke: var(--text);
  }
  #preview svg [fill="none"] { fill: none; }
  #preview svg [stroke="none"] { stroke: none; }
  #preview svg .mark path,
  #preview svg .mark rect,
  #preview svg .mark ellipse,
  #preview svg .mark polygon,
  #preview svg .mark line {
    fill: var(--accent) !important;
    stroke: var(--accent) !important;
  }

  /* Editor */
  .editor-wrap {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
  }
  #notation {
    border-radius: var(--radius) var(--radius) 0 0;
  }
  #notation {
    display: block;
    width: 100%;
    min-height: 90px;
    max-height: 160px;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
    line-height: 1.6;
    padding: 10px 12px;
    resize: vertical;
    caret-color: var(--accent);
  }
  #notation::placeholder { color: var(--text-dim); }

  .editor-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 8px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    gap: 6px;
  }
  .footer-left { display: flex; gap: 6px; }
  .footer-right { display: flex; gap: 6px; }

  .action-btn {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    transition: background 0.08s, transform 0.08s;
    letter-spacing: 0.04em;
    touch-action: manipulation;
  }
  .btn-copy { background: var(--accent); color: #111; }
  .btn-clear { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-templates { background: transparent; color: var(--accent2); border: 1px solid #2a5a4a; }
  .btn-templates.active { background: #0a2a1f; border-color: var(--accent2); }

  .arrow-btns { display: flex; gap: 3px; }
  .btn-arrow {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: var(--radius-sm);
    padding: 5px 8px;
    font-size: 0.7rem;
    cursor: pointer;
    touch-action: manipulation;
    font-family: 'IBM Plex Sans', sans-serif;
    line-height: 1;
  }

  /* Arrow key row — below keyboard, left-aligned */
  .row-arrows {
    justify-content: flex-start;
    gap: 4px;
  }
  .row-arrows .key {
    flex: 0 0 auto;
    width: 48px;
    height: 36px;
    font-size: 1rem;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* Chord + text insert buttons */
  .btn-chord {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--btn-border);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0;
  }
  .btn-addtext {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1rem;
    font-weight: 700;
    font-style: italic;
    padding: 3px 10px;
  }

  /* Insert popups */
  .insert-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .insert-overlay.open { display: flex; }
  .insert-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    width: 100%;
    max-width: 340px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .insert-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--accent);
  }
  .insert-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
    padding: 9px 12px;
    outline: none;
    caret-color: var(--accent);
  }
  .insert-input:focus { border-color: var(--accent); }
  .insert-radios {
    display: flex;
    gap: 16px;
    font-size: 0.82rem;
    color: var(--text);
  }
  .insert-radios label, .insert-radios .insert-radio-opt {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .insert-radios input[type="radio"] { accent-color: var(--accent); }
  .insert-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* Split copy button */
  .copy-split {
    display: flex;
    position: relative;
  }
  .copy-split .btn-copy-main {
    background: var(--accent);
    color: #111;
    border: none;
    border-radius: var(--radius-sm) 0 0 var(--radius-sm);
    padding: 5px 12px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    touch-action: manipulation;
  }
  .copy-split-divider {
    width: 1px;
    background: rgba(0,0,0,0.25);
    flex-shrink: 0;
  }
  .copy-split .btn-copy-arrow {
    background: var(--accent);
    color: #111;
    border: none;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 5px 7px;
    font-size: 0.6rem;
    cursor: pointer;
    touch-action: manipulation;
    display: flex;
    align-items: center;
  }
  .copy-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    z-index: 50;
    white-space: nowrap;
    min-width: 100%;
  }
  .copy-dropdown.open { display: block; }
  .copy-dropdown-item {
    display: block;
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 8px 14px;
    text-align: left;
    cursor: pointer;
    letter-spacing: 0.04em;
    touch-action: manipulation;
  }
  .copy-dropdown-item:hover { background: var(--surface2); }

  /* Tools button + dropdown */
  .btn-tools {
    background: transparent;
    color: var(--accent2);
    border: 1px solid #2a5a4a;
  }
  .tools-wrap {
    position: relative;
  }
  .tools-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    z-index: 50;
    white-space: nowrap;
    min-width: 160px;
  }
  .tools-dropdown.open { display: block; }
  .tools-dropdown-item {
    display: block;
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 8px 14px;
    text-align: left;
    cursor: pointer;
    letter-spacing: 0.04em;
    touch-action: manipulation;
  }
  .tools-dropdown-item:hover { background: var(--surface2); }
  .tools-sel-preview {
    padding: 7px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tools-sel-preview.has-sel { color: var(--accent2); }
  .tools-sel-preview.no-sel  { font-style: italic; }

  /* Template panel */
  #tmpl-panel {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.22s ease, padding 0.22s ease, border-width 0.22s ease;
    padding: 0 8px;
    border-width: 0;
  }
  #tmpl-panel.open { max-height: 300px; padding: 8px; border-width: 1.5px; }
  .tmpl-grid { display: flex; flex-wrap: wrap; gap: 5px; }
  .tmpl-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(0.65rem, 2.4vw, 0.8rem);
    font-weight: 600;
    background: var(--btn-bg);
    color: var(--accent2);
    border: 1.5px solid #2a5a4a;
    border-radius: var(--radius-sm);
    padding: 7px 10px;
    cursor: pointer;
    transition: background 0.08s, transform 0.08s;
    white-space: nowrap;
    touch-action: manipulation;
  }

  .copy-toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-60px);
    background: var(--accent2);
    color: #0a2a1f;
    font-weight: 600;
    font-size: 0.8rem;
    padding: 8px 20px;
    border-radius: 20px;
    transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 999;
    white-space: nowrap;
  }
  .copy-toast.show { transform: translateX(-50%) translateY(0); }

  /* Key rows */
  .key-row {
    display: flex;
    flex-wrap: nowrap;
    gap: 4px;
    width: 100%;
  }
  .key {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    border: 1.5px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--text);
    border-radius: var(--radius-sm);
    cursor: pointer;
    user-select: none;
    transition: background 0.08s, transform 0.08s;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    flex: 1 1 0;
    min-width: 0;
    padding: 0;
    white-space: nowrap;
    overflow: hidden;
    touch-action: manipulation;
  }
  @keyframes keyflash {
    0%   { background: #556; transform: scale(0.88); }
    40%  { background: #445; }
    100% { background: var(--btn-bg); transform: scale(1); }
  }
  @keyframes keyflash-primary {
    0%   { background: #4a4520; transform: scale(0.88); }
    40%  { background: #3a3518; }
    100% { background: var(--btn-bg-lg); transform: scale(1); }
  }
  @keyframes keyflash-bksp {
    0%   { background: #3a1515; transform: scale(0.88); }
    100% { background: #1e1010; transform: scale(1); }
  }
  @keyframes btnflash {
    0%   { opacity: 0.6; transform: scale(0.94); }
    100% { opacity: 1;   transform: scale(1); }
  }
  @keyframes tmplflash {
    0%   { background: #0d3d2a; transform: scale(0.92); }
    100% { background: var(--btn-bg); transform: scale(1); }
  }
  .key.flash               { animation: keyflash 0.25s cubic-bezier(0.2, 0, 0.4, 1); }
  .row-primary .key.flash  { animation: keyflash-primary 0.25s cubic-bezier(0.2, 0, 0.4, 1); }
  .key-bksp.flash          { animation: keyflash-bksp 0.25s cubic-bezier(0.2, 0, 0.4, 1) !important; }
  .tmpl-btn.flash          { animation: tmplflash 0.25s cubic-bezier(0.2, 0, 0.4, 1); }
  .action-btn.flash        { animation: btnflash 0.2s cubic-bezier(0.2, 0, 0.4, 1); }

  .row-primary .key {
    height: 48px;
    font-size: clamp(0.85rem, 3.2vw, 1.2rem);
    border-color: var(--btn-border-lg);
    background: var(--btn-bg-lg);
    color: var(--accent);
  }
  .key-bksp {
    flex: 1.4 1 0 !important;
    background: #1e1010 !important;
    border-color: #4a2020 !important;
    color: #e06060 !important;
    font-size: clamp(0.85rem, 3vw, 1rem) !important;
  }
  .row-notes .key { height: 42px; font-size: clamp(0.8rem, 2.8vw, 1rem); }
  .row-notes-pad { padding: 0 32px; }
  .key-z { color: var(--accent2) !important; }
  .key-space {
    flex: 4 1 0 !important;
    font-size: clamp(0.55rem, 2vw, 0.7rem) !important;
    letter-spacing: 0.06em;
    color: var(--text-dim) !important;
  }
  .key-nl {
    flex: 1.5 1 0 !important;
    font-size: clamp(0.6rem, 2.2vw, 0.75rem) !important;
    color: var(--text-dim) !important;
  }
  .row-small .key { height: 36px; font-size: clamp(0.7rem, 2.6vw, 0.9rem); color: var(--text-dim); }

  /* Gesture system — note key press/release animation */
  @keyframes keyshrink {
    0%   { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .key.pressed { transform: scale(1.18); z-index: 10; position: relative; transition: none; }
  .key.shrink  { animation: keyshrink 0.2s cubic-bezier(0.2, 0, 0.4, 1); }

  /* Gesture note badge */
  #gesture-badge {
    display: none;
    position: fixed;
    transform: translate(-50%, -100%);
    margin-top: -14px;
    background: rgba(30, 30, 36, 0.82);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: var(--radius-sm);
    padding: 8px 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
    pointer-events: none;
    z-index: 102;
  }
  #gesture-badge.visible { display: block; }
  @media (pointer: coarse) {
    #gesture-badge { margin-top: -48px; }
  }

  /* Gesture chevron wheel */
  #gesture-wheel {
    display: none;
    position: fixed;
    width: 160px;
    height: 160px;
    transform: translate(-50%, -50%);
    z-index: 101;
    pointer-events: none;
  }
  #gesture-wheel.visible { display: block; }

  .chev-path {
    fill: none;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .chev-path.dim    { stroke: rgba(255,255,255,0.2); }
  .chev-path.bright { stroke: rgba(255,255,255,0.82); }

  @keyframes nudge-up        { 0%{transform:translateY(0)} 35%{transform:translateY(-5px)} 100%{transform:translateY(0)} }
  @keyframes nudge-down      { 0%{transform:translateY(0)} 35%{transform:translateY( 5px)} 100%{transform:translateY(0)} }
  @keyframes nudge-left      { 0%{transform:translateX(0)} 35%{transform:translateX(-5px)} 100%{transform:translateX(0)} }
  @keyframes nudge-right     { 0%{transform:translateX(0)} 35%{transform:translateX( 5px)} 100%{transform:translateX(0)} }
  @keyframes nudge-up-rev    { 0%{transform:translateY(0)} 35%{transform:translateY( 5px)} 100%{transform:translateY(0)} }
  @keyframes nudge-down-rev  { 0%{transform:translateY(0)} 35%{transform:translateY(-5px)} 100%{transform:translateY(0)} }
  @keyframes nudge-left-rev  { 0%{transform:translateX(0)} 35%{transform:translateX( 5px)} 100%{transform:translateX(0)} }
  @keyframes nudge-right-rev { 0%{transform:translateX(0)} 35%{transform:translateX(-5px)} 100%{transform:translateX(0)} }

  #chev-up-g.nudge        { animation: nudge-up        0.32s cubic-bezier(0.2,0,0.4,1); }
  #chev-down-g.nudge      { animation: nudge-down      0.32s cubic-bezier(0.2,0,0.4,1); }
  #chev-left-g.nudge      { animation: nudge-left      0.32s cubic-bezier(0.2,0,0.4,1); }
  #chev-right-g.nudge     { animation: nudge-right     0.32s cubic-bezier(0.2,0,0.4,1); }
  #chev-up-g.nudge-rev    { animation: nudge-up-rev    0.32s cubic-bezier(0.2,0,0.4,1); }
  #chev-down-g.nudge-rev  { animation: nudge-down-rev  0.32s cubic-bezier(0.2,0,0.4,1); }
  #chev-left-g.nudge-rev  { animation: nudge-left-rev  0.32s cubic-bezier(0.2,0,0.4,1); }
  #chev-right-g.nudge-rev { animation: nudge-right-rev 0.32s cubic-bezier(0.2,0,0.4,1); }
</style>
</head>
<body>

  <a href="#" class="logo">ABC <span>Notepad</span></a>

  <svg viewBox="0 0 200 200" width="160" height="160" overflow="visible">
    <g id="chev-up-g">    <polyline class="chev-path dim" points="76,40 100,28 124,40"/></g>
    <g id="chev-down-g">  <polyline class="chev-path dim" points="76,160 100,172 124,160"/></g>
    <g id="chev-left-g">  <polyline class="chev-path dim" points="40,76 28,100 40,124"/></g>
    <g id="chev-right-g"> <polyline class="chev-path dim" points="160,76 172,100 160,124"/></g>
  </svg>
</div>

<div class="copy-toast" id="toast">Copied ✓</div>

<script>
  const ta = document.getElementById('notation');
  const toast = document.getElementById('toast');
  const previewDiv = document.getElementById('preview');

  let taFocused = false;
  let savedStart = 0, savedEnd = 0;
  let debounceTimer = null;

  const taDisplay = document.getElementById('notation-display');

  function renderStaticDisplay() {
    const val = ta.value;
    const pos = savedStart;
    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    if (!val) {
      taDisplay.innerHTML = '<span class="display-placeholder">' + esc(ta.placeholder) + '</span>';
    } else {
      const before = val.slice(0, pos);
      const after  = val.slice(pos);
      taDisplay.innerHTML = esc(before) + '<span class="editor-cursor"></span>' + esc(after);
    }
    taDisplay.scrollTop = ta.scrollTop;
  }

  // Show static display whenever textarea is not focused
  function syncDisplayIfUnfocused() {
    if (!taFocused) {
      renderStaticDisplay();
      if (!taDisplay.classList.contains('active')) {
        ta.classList.add('hidden');
        taDisplay.classList.add('active');
      }
    }
  }

  function showStaticDisplay() {
    renderStaticDisplay();
    // Match any user-resized height
    const h = ta.style.height;
    taDisplay.style.height = h || '';
    ta.classList.add('hidden');
    taDisplay.classList.add('active');
  }
  function hideStaticDisplay() {
    taDisplay.classList.remove('active');
    ta.classList.remove('hidden');
    // Restore any height the user had set (in case display div was resized)
    ta.style.height = taDisplay.style.height || '';
  }

  // Tapping the display div refocuses the textarea
  taDisplay.addEventListener('mousedown', e => {
    e.preventDefault();
    hideStaticDisplay();
    ta.focus();
    ta.setSelectionRange(savedStart, savedEnd);
  });
  taDisplay.addEventListener('touchstart', e => {
    e.preventDefault();
    hideStaticDisplay();
    ta.focus();
    ta.setSelectionRange(savedStart, savedEnd);
  }, { passive: false });

  ta.addEventListener('focus', () => { taFocused = true; hideStaticDisplay(); });
  ta.addEventListener('blur', () => {
    taFocused = false;
    savedStart = ta.selectionStart;
    savedEnd = ta.selectionEnd;
    showStaticDisplay();
  });
  ta.addEventListener('keyup', () => {
    if (taFocused) { savedStart = ta.selectionStart; savedEnd = ta.selectionEnd; }
  });
  ta.addEventListener('click', () => {
    if (taFocused) { savedStart = ta.selectionStart; savedEnd = ta.selectionEnd; updateToolsBtn(); }
  });
  ta.addEventListener('mouseup', () => {
    if (taFocused) { savedStart = ta.selectionStart; savedEnd = ta.selectionEnd; updateToolsBtn(); }
  });
  document.addEventListener('selectionchange', () => {
    if (taFocused) {
      savedStart = ta.selectionStart;
      savedEnd = ta.selectionEnd;
      updateToolsBtn();
    }
  });
  const clearBtn  = document.getElementById('clearBtn');
  const toolsBtn  = document.getElementById('toolsBtn');

  function closeTools() {
    document.getElementById('toolsDropdown').classList.remove('open');
  }

  function updateToolsBtn() {
    const hasSel = savedStart !== savedEnd;
    toolsBtn.classList.toggle('has-selection', hasSel);
    if (!hasSel) closeTools();
  }

  function updateClearBtn() {
    clearBtn.style.visibility = ta.value ? '' : 'hidden';
    updateToolsBtn();
  }
  updateClearBtn();
  syncDisplayIfUnfocused();

  ta.addEventListener('input', () => { schedulePreview(); updateClearBtn(); });

  const zoomSlider = document.getElementById('zoom-slider');
  let zoomLevel = 0.5;

  const BASE_MULTIPLIER = 1.45;
  const SCALING_FACTOR = 1.4;

  function getStaffwidth() {
    const containerWidth = previewDiv.offsetWidth || 320;
    const multiplier = BASE_MULTIPLIER - (zoomLevel - 0.5) * SCALING_FACTOR;
    return Math.round(containerWidth * multiplier);
  }

  zoomSlider.addEventListener('input', () => {
    zoomLevel = parseFloat(zoomSlider.value);
    renderPreview();
  });

  function schedulePreview() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(renderPreview, 900);
  }

  function renderPreview() {
    const raw = ta.value.trim();
    if (!raw) { previewDiv.innerHTML = ''; return; }
    try {
      ABCJS.renderAbc('preview', raw, {
        responsive: 'resize',
        staffwidth: getStaffwidth(),
        add_classes: true,
        paddingtop: 6, paddingbottom: 6, paddingleft: 8, paddingright: 8,
        jazzchords: false,
        format: { gchordfont: 'Helvetica 12' }
      });
    } catch(e) {}
  }

  // Core insert — used by both key buttons and template buttons
  function doInsert(text, refocus) {
    const s = savedStart;
    const e = savedEnd;
    const atEnd = e === ta.value.length;
    ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
    savedStart = s + text.length;
    savedEnd = savedStart;
    if (refocus) {
      ta.focus();
      ta.setSelectionRange(savedStart, savedEnd);
    } else if (!taFocused) {
      syncDisplayIfUnfocused();
    }
    if (atEnd) ta.scrollTop = ta.scrollHeight;
    updateClearBtn();
    schedulePreview();
  }

  function bksp() {
    const wasActive = taFocused;
    const atEnd = savedEnd === ta.value.length;
    if (savedStart === savedEnd && savedStart > 0) {
      ta.value = ta.value.slice(0, savedStart - 1) + ta.value.slice(savedEnd);
      savedStart -= 1; savedEnd = savedStart;
    } else if (savedStart !== savedEnd) {
      ta.value = ta.value.slice(0, savedStart) + ta.value.slice(savedEnd);
      savedEnd = savedStart;
    }
    if (wasActive) { ta.focus(); ta.setSelectionRange(savedStart, savedEnd); }
    else syncDisplayIfUnfocused();
    if (atEnd) ta.scrollTop = ta.scrollHeight;
    updateClearBtn();
    schedulePreview();
  }

  function moveCursor(key) {
    const wasFocused = taFocused;
    const s = savedStart;
    const val = ta.value;
    let pos;
    if (key === 'ArrowLeft') {
      pos = s > 0 ? s - 1 : 0;
    } else if (key === 'ArrowRight') {
      pos = s < val.length ? s + 1 : val.length;
    } else {
      const lines = val.split('\n');
      let line = 0, col = 0, count = 0;
      for (let i = 0; i < lines.length; i++) {
        if (count + lines[i].length >= s) { line = i; col = s - count; break; }
        count += lines[i].length + 1;
      }
      if (key === 'ArrowUp') {
        pos = line === 0 ? 0 : lines.slice(0, line - 1).reduce((a, l) => a + l.length + 1, 0) + Math.min(col, lines[line - 1].length);
      } else {
        pos = line === lines.length - 1 ? val.length : lines.slice(0, line + 1).reduce((a, l) => a + l.length + 1, 0) + Math.min(col, lines[line + 1].length);
      }
    }
    savedStart = pos; savedEnd = pos;
    if (wasFocused) ta.setSelectionRange(pos, pos);
    else syncDisplayIfUnfocused();
  }

  function arrowLeft()  { moveCursor('ArrowLeft');  }
  function arrowRight() { moveCursor('ArrowRight'); }
  function arrowUp()    { moveCursor('ArrowUp');    }
  function arrowDown()  { moveCursor('ArrowDown');  }

  function toggleTemplates() {
    const panel = document.getElementById('tmpl-panel');
    const btn = document.getElementById('tmplToggle');
    const isOpen = panel.classList.toggle('open');
    btn.classList.toggle('active', isOpen);
  }

  function closeTemplates() {
    const panel = document.getElementById('tmpl-panel');
    const btn = document.getElementById('tmplToggle');
    panel.classList.remove('open');
    btn.classList.remove('active');
  }

  function copyText() {
    closeCopyDropdown();
    const before = document.getElementById('wrapBefore').value;
    const after = document.getElementById('wrapAfter').value;
    const text = before + '\n' + ta.value + '\n' + after;
    navigator.clipboard.writeText(text).then(showToast).catch(() => {
      try { document.execCommand('copy'); showToast(); } catch(e) {}
    });
  }

  function copyTextRaw() {
    navigator.clipboard.writeText(ta.value).then(showToast).catch(() => {
      try { document.execCommand('copy'); showToast(); } catch(e) {}
    });
    closeCopyDropdown();
  }

  function toggleCopyDropdown() {
    document.getElementById('copyDropdown').classList.toggle('open');
  }

  function closeCopyDropdown() {
    document.getElementById('copyDropdown').classList.remove('open');
  }

  document.addEventListener('mousedown', e => {
    if (!e.target.closest('.copy-split')) closeCopyDropdown();
  });
  document.addEventListener('touchstart', e => {
    if (!e.target.closest('.copy-split')) closeCopyDropdown();
  }, { passive: true });

  function showToast() {
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function clearStep1() {
    if (!ta.value) return;
    activeBtn = null; // allow modal buttons to get fresh touch events
    const overlay = document.getElementById('clear-overlay');
    overlay.style.display = 'flex';
    overlay.onclick = e => { if (e.target === overlay) clearCancel(); };
  }

  function clearStep2() {
    ta.value = ''; savedStart = 0; savedEnd = 0;
    previewDiv.innerHTML = '';
    previewDiv.removeAttribute('style');
    clearTimeout(debounceTimer);
    updateClearBtn();
    syncDisplayIfUnfocused();
    clearCancel();
  }

  function clearCancel() {
    document.getElementById('clear-overlay').style.display = 'none';
  }

  function toggleZoom() {
    const panel = document.getElementById('zoom-panel');
    const btn = document.getElementById('zoomToggle');
    const isOpen = panel.classList.toggle('open');
    btn.classList.toggle('active', isOpen);
  }

  function openSettings() {
    document.getElementById('settings-overlay').classList.add('open');
  }

  function closeSettings() {
    document.getElementById('settings-overlay').classList.remove('open');
  }

  // Modal close button and overlay click
  document.getElementById('modalClose').addEventListener('click', closeSettings);
  document.getElementById('settings-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('settings-overlay')) closeSettings();
  });

  // Close zoom panel when clicking outside
  document.addEventListener('mousedown', e => {
    if (!e.target.closest('#zoom-panel') && !e.target.closest('#zoomToggle')) {
      document.getElementById('zoom-panel').classList.remove('open');
      document.getElementById('zoomToggle').classList.remove('active');
    }
  });
  document.addEventListener('touchstart', e => {
    if (!e.target.closest('#zoom-panel') && !e.target.closest('#zoomToggle')) {
      document.getElementById('zoom-panel').classList.remove('open');
      document.getElementById('zoomToggle').classList.remove('active');
    }
  }, { passive: true });

  document.getElementById('wrapBefore').value = "```abc\n{\"staffwidth\": 500}\n---\n%%MIDI gchord \"none\"";
  document.getElementById('wrapAfter').value = "```";

  // --- Tools ---
  function toggleTools() {
    const dropdown = document.getElementById('toolsDropdown');
    const preview  = document.getElementById('toolsSelPreview');
    const isOpen   = dropdown.classList.toggle('open');
    if (isOpen) {
      const sel = ta.value.slice(savedStart, savedEnd);
      if (sel) {
        preview.textContent = sel;
        preview.className = 'tools-sel-preview has-sel';
      } else {
        preview.textContent = 'No selection';
        preview.className = 'tools-sel-preview no-sel';
      }
    }
  }

  // Close tools dropdown on outside click/tap
  document.addEventListener('mousedown', e => {
    if (!e.target.closest('.tools-wrap')) closeTools();
  });
  document.addEventListener('touchstart', e => {
    if (!e.target.closest('.tools-wrap')) closeTools();
  }, { passive: true });

  // Transpose a single note token one octave up or down.
  // A note token is: optional accidental(s), note letter, optional octave markers (',+)
  // Up:   C→c, c→c', c'→c'', C,→C, C,,→C, (bottom out at C/A-G uppercase with commas, shift up one)
  // Down: c''→c', c'→c, c→C, C→C,
  function transposeNoteUp(acc, letter, octs) {
    // octs is the string of ' and , after the note letter
    const commas = (octs.match(/,/g) || []).length;
    const ticks  = (octs.match(/'/g) || []).length;
    if (commas > 0) {
      // e.g. C,, → C, → C
      return acc + letter.toUpperCase() + ','.repeat(commas - 1);
    } else if (letter === letter.toUpperCase()) {
      // uppercase, no commas → go to lowercase
      return acc + letter.toLowerCase() + "'".repeat(ticks);
    } else {
      // lowercase → add a tick
      return acc + letter.toLowerCase() + "'".repeat(ticks + 1);
    }
  }

  function transposeNoteDown(acc, letter, octs) {
    const commas = (octs.match(/,/g) || []).length;
    const ticks  = (octs.match(/'/g) || []).length;
    if (ticks > 0) {
      // remove one tick
      return acc + letter.toLowerCase() + "'".repeat(ticks - 1);
    } else if (letter === letter.toLowerCase()) {
      // lowercase, no ticks → go to uppercase
      return acc + letter.toUpperCase() + ','.repeat(commas);
    } else {
      // uppercase → add a comma
      return acc + letter.toUpperCase() + ','.repeat(commas + 1);
    }
  }

  // Regex: optional accidental(s), note letter, octave markers
  const NOTE_RE = /([_^=]*)([a-gA-G])([',]*)/g;

  function transformSelection(fn) {
    const s = savedStart, e = savedEnd;
    if (s === e) return;
    const before = ta.value.slice(0, s);
    const sel    = ta.value.slice(s, e);
    const after  = ta.value.slice(e);
    const result = fn(sel);
    ta.value   = before + result + after;
    savedStart = s;
    savedEnd   = s + result.length;
    if (taFocused) { ta.focus(); ta.setSelectionRange(savedStart, savedEnd); }
    updateClearBtn();
    schedulePreview();
  }

  function transposeUp() {
    closeTools();
    transformSelection(sel => sel.replace(NOTE_RE, (_, acc, letter, octs) =>
      transposeNoteUp(acc, letter, octs)));
  }

  function transposeDown() {
    closeTools();
    transformSelection(sel => sel.replace(NOTE_RE, (_, acc, letter, octs) =>
      transposeNoteDown(acc, letter, octs)));
  }

  // Note length token: optional multiplier digit(s) OR slash notation
  // e.g. C2 → C4, C → C2, C/ → C, C3/2 → C3 (double: *2 numerator)
  // Halve: C2 → C, C → C/, C/ → C/2 (but C/ means /2 so halving = /4 → use C/4? spec says C/)
  // We handle: bare note, noteN, note/N, noteN/M
  function scaleLengths(sel, multiply) {
    // Match note letter + octave markers, then optional length suffix
    // Length suffix patterns: number, /number, number/number, /  (bare slash = /2)
    return sel.replace(/([a-gA-GzZ][',]*)(\d+\/\d+|\/\d+|\d+|\/)?/g, (match, notePart, len) => {
      if (!len) {
        // implied length 1
        if (multiply) return notePart + '2';
        else          return notePart + '/';
      }
      if (len === '/') {
        // /2 shorthand
        if (multiply) return notePart; // /2 * 2 = 1, back to bare
        else          return notePart + '/2'; // /2 / 2 = /4... spec says use /2 for halving bare, so /2/2 = leave as /2? Use explicit /4
        // Actually: / means /2. Halving /2 → /4
        // But user said halving C → C/. So halving C/ → C/4 seems right.
        // Re-reading: user said halving plain note = C/. So / = /2. Halving that = /4.
      }
      if (len.includes('/') && !len.startsWith('/')) {
        // N/M form
        const [num, den] = len.split('/').map(Number);
        if (multiply) return notePart + (num * 2) + '/' + den;
        else          return notePart + num + '/' + (den * 2);
      }
      if (len.startsWith('/')) {
        // /N form
        const den = parseInt(len.slice(1));
        if (multiply) {
          const newDen = den / 2;
          return newDen === 1 ? notePart : notePart + '/' + newDen;
        } else {
          return notePart + '/' + (den * 2);
        }
      }
      // Plain number
      const n = parseInt(len);
      if (multiply) return notePart + (n * 2);
      else {
        if (n === 1) return notePart + '/';
        if (n % 2 === 0) return notePart + (n / 2 === 1 ? '' : n / 2);
        // odd number: use fraction
        return notePart + n + '/2';
      }
    });
  }

  function doubleLength() {
    closeTools();
    transformSelection(sel => scaleLengths(sel, true));
  }

  function halveLength() {
    closeTools();
    transformSelection(sel => scaleLengths(sel, false));
  }

  function removeText() {
    closeTools();
    // Remove quoted strings (chord symbols / annotations): "..."
    transformSelection(sel => sel.replace(/"[^"]*"/g, ''));
  }

  function removeAccidentals() {
    closeTools();
    // Strip ^ _ = outside of quoted strings
    transformSelection(sel => {
      let result = '';
      let inQuote = false;
      for (let i = 0; i < sel.length; i++) {
        const ch = sel[i];
        if (ch === '"') { inQuote = !inQuote; result += ch; continue; }
        if (!inQuote && (ch === '^' || ch === '_' || ch === '=')) continue;
        result += ch;
      }
      return result;
    });
  }

  // Enharmonic respelling.
  // Strategy: convert to chromatic pitch number, find the enharmonic spelling, convert back.
  // ABC octave: uppercase = middle octave (C=60), lowercase = one up, ' adds one, , subtracts one.
  // Chromatic values within octave (C=0): C=0,D=2,E=4,F=5,G=7,A=9,B=11
  const CHROMA = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
  const FROM_CHROMA_SHARP = {0:'C',1:'^C',2:'D',3:'^D',4:'E',5:'F',6:'^F',7:'G',8:'^G',9:'A',10:'^A',11:'B'};
  const FROM_CHROMA_FLAT  = {0:'C',1:'_D',2:'D',3:'_E',4:'E',5:'F',6:'_G',7:'G',8:'_A',9:'A',10:'_B',11:'B'};

  function noteToAbcOctaveLevel(letter, octs) {
    // uppercase = level 0, lowercase = level 1, each ' adds 1, each , subtracts 1
    const base = letter === letter.toUpperCase() ? 0 : 1;
    const ticks  = (octs.match(/'/g) || []).length;
    const commas = (octs.match(/,/g) || []).length;
    return base + ticks - commas;
  }

  function abcOctaveLevelToOcts(level, useUppercase) {
    // uppercase base level = 0, lowercase base level = 1
    const base = useUppercase ? 0 : 1;
    const offset = level - base;
    if (offset > 0) return "'".repeat(offset);
    if (offset < 0) return ','.repeat(-offset);
    return '';
  }

  function respellEnharmonicNote(acc, letter, octs) {
    const upperLetter = letter.toUpperCase();
    const baseChroma = CHROMA[upperLetter];
    const accShift = acc === '^' ? 1 : acc === '_' ? -1 : 0;
    const chroma = ((baseChroma + accShift) % 12 + 12) % 12;
    const level = noteToAbcOctaveLevel(letter, octs);

    // Current spelling uses sharp or flat (or natural — nothing to respell)
    if (acc === '' || acc === '=') return acc + letter + octs;

    // Pick the opposite spelling
    const newSpelling = acc === '^' ? FROM_CHROMA_FLAT[chroma] : FROM_CHROMA_SHARP[chroma];
    if (!newSpelling || newSpelling === acc + upperLetter) return acc + letter + octs; // no change (e.g. natural notes)

    // Parse new spelling
    const newAcc    = newSpelling.length === 2 ? newSpelling[0] : '';
    const newUpper  = newSpelling.length === 2 ? newSpelling[1] : newSpelling[0];
    const newChroma = CHROMA[newUpper];

    // Determine if the chroma crossed a C boundary (i.e. octave shift needed)
    // e.g. ^B (chroma 0, which is C) respelled as _c: the new note C is "above" B in the scale
    // We need the new note to represent the same absolute pitch.
    // Absolute pitch = level * 12 + baseChroma + accShift
    // New absolute pitch should be the same.
    // new level = (absolutePitch - newChroma) / 12
    const absolutePitch = level * 12 + baseChroma + accShift;
    // Find the level that puts newChroma closest to absolutePitch
    let newLevel = Math.round((absolutePitch - newChroma) / 12);
    // Verify: newLevel * 12 + newChroma should === absolutePitch
    // (it will be, since chroma values match mod 12)

    // Convert new level back to ABC octave markers
    const newUpperBool = newLevel <= 0; // level 0 and below = uppercase
    // Actually: uppercase = level 0, lowercase = level 1+, but commas push uppercase down
    // Simpler: if newLevel < 1 use uppercase, else lowercase
    const useUppercase = newLevel < 1;
    const newLetter = useUppercase ? newUpper : newUpper.toLowerCase();
    const newOcts = abcOctaveLevelToOcts(newLevel, useUppercase);

    return newAcc + newLetter + newOcts;
  }

  function respellEnharmonic() {
    closeTools();
    transformSelection(sel => sel.replace(/([_^]?)([a-gA-G])([',]*)/g, (_, acc, letter, octs) =>
      respellEnharmonicNote(acc, letter, octs)));
  }

  // --- Chord popup ---
  let popupPrevFocused = false; // was textarea focused before popup opened

  function openChordPopup() {
    popupPrevFocused = taFocused;
    document.getElementById('chordInput').value = '';
    document.getElementById('chordOverlay').classList.add('open');
    document.getElementById('chordInput').focus();
  }
  function closeChordPopup() {
    document.getElementById('chordOverlay').classList.remove('open');
    if (popupPrevFocused) {
      ta.focus();
      ta.setSelectionRange(savedStart, savedEnd);
    } else {
      document.activeElement.blur();
    }
  }
  function doneChordPopup() {
    const val = document.getElementById('chordInput').value;
    closeChordPopup();
    if (!val) return;
    doInsert('"' + val + '"', popupPrevFocused);
  }
  document.getElementById('chordOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('chordOverlay')) closeChordPopup();
  });
  document.getElementById('chordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); doneChordPopup(); }
    if (e.key === 'Escape') closeChordPopup();
  });

  // --- Text popup ---
  function openTextPopup() {
    popupPrevFocused = taFocused;
    document.getElementById('textInput').value = '';
    document.querySelector('input[name="textPos"][value="above"]').checked = true;
    document.getElementById('textOverlay').classList.add('open');
    document.getElementById('textInput').focus();
  }
  function closeTextPopup() {
    document.getElementById('textOverlay').classList.remove('open');
    if (popupPrevFocused) {
      ta.focus();
      ta.setSelectionRange(savedStart, savedEnd);
    } else {
      document.activeElement.blur();
    }
  }
  function doneTextPopup() {
    const val = document.getElementById('textInput').value;
    const pos = document.querySelector('input[name="textPos"]:checked').value;
    closeTextPopup();
    if (!val) return;
    const prefix = pos === 'above' ? '^' : '_';
    doInsert('"' + prefix + val + '"', popupPrevFocused);
  }
  document.getElementById('textOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('textOverlay')) closeTextPopup();
  });
  document.getElementById('textInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); doneTextPopup(); }
    if (e.key === 'Escape') closeTextPopup();
  });
  // Keep text input focused when tapping radio buttons OR their spans.
  const textInputEl = document.getElementById('textInput');
  document.querySelectorAll('.insert-radio-opt').forEach(span => {
    ['mousedown', 'touchstart'].forEach(evtType => {
      span.addEventListener(evtType, e => {
        e.preventDefault();
        const radio = span.querySelector('input[type="radio"]');
        if (radio) radio.checked = true;
        textInputEl.focus();
      }, { passive: false });
    });
  });
  document.querySelectorAll('.insert-radios input[type="radio"]').forEach(radio => {
    ['mousedown', 'touchstart'].forEach(evtType => {
      radio.addEventListener(evtType, e => {
        e.preventDefault();
        radio.checked = true;
        textInputEl.focus();
      }, { passive: false });
    });
  });

  // Unified button interaction — works for both touch and mouse
  const actions = { toggleTemplates, toggleZoom, openSettings, copyText, copyTextRaw, toggleCopyDropdown, clearStep1, clearStep2, clearCancel, bksp, arrowLeft, arrowRight, arrowUp, arrowDown, toggleTools, transposeUp, transposeDown, doubleLength, halveLength, removeText, removeAccidentals, respellEnharmonic, openChordPopup, closeChordPopup, doneChordPopup, openTextPopup, closeTextPopup, doneTextPopup };

  const releaseActions = new Set(['copyText', 'copyTextRaw', 'toggleCopyDropdown', 'toggleTemplates', 'toggleZoom', 'openSettings', 'clearStep1', 'clearStep2', 'clearCancel', 'toggleTools', 'openChordPopup', 'openTextPopup']);

  function handleButtonPress(btn) {
    // Release-action buttons animate on release, not press
    if (!releaseActions.has(btn.dataset.action)) {
      btn.classList.remove('flash');
      void btn.offsetWidth;
      btn.classList.add('flash');
    }
    if (releaseActions.has(btn.dataset.action)) return;
    // Fire all other actions immediately on press
    if (btn.dataset.action) {
      const fn = actions[btn.dataset.action];
      if (fn) fn();
    } else if (btn.dataset.insert !== undefined) {
      const isKey = btn.classList.contains('key');
      if (btn.classList.contains('tmpl-btn')) {
        closeTemplates();
        doInsert(btn.dataset.insert, taFocused);
      } else {
        doInsert(btn.dataset.insert, isKey && taFocused);
      }
    }
  }

  function handleButtonRelease(btn) {
    if (btn.dataset.action && releaseActions.has(btn.dataset.action)) {
      btn.classList.remove('flash');
      void btn.offsetWidth;
      btn.classList.add('flash');
      const fn = actions[btn.dataset.action];
      if (fn) fn();
    }
  }

  // ---- Gesture system for note-letter keys (A-G, a-g) ----
  const OCTAVE_PX   = 40;
  const MAX_OCTAVE  = 3;
  const H_THRESHOLD = 40;
  const WHEEL_DELAY = 180;

  function isNoteKey(btn) {
    return btn && btn.dataset.insert && /^[a-gA-G]$/.test(btn.dataset.insert);
  }

  const wheel  = document.getElementById('gesture-wheel');
  const badge  = document.getElementById('gesture-badge');
  const chevGrps = {
    up:    document.getElementById('chev-up-g'),
    down:  document.getElementById('chev-down-g'),
    left:  document.getElementById('chev-left-g'),
    right: document.getElementById('chev-right-g'),
  };

  function setChevState(grp, active) {
    const path = grp.querySelector('.chev-path');
    path.classList.toggle('dim',    !active);
    path.classList.toggle('bright',  active);
  }

  function nudgeChev(grp, reverse) {
    const cls = reverse ? 'nudge-rev' : 'nudge';
    grp.classList.remove('nudge', 'nudge-rev');
    void grp.getBoundingClientRect();
    grp.classList.add(cls);
    grp.addEventListener('animationend', () => grp.classList.remove(cls), { once: true });
  }

  Object.values(chevGrps).forEach(g => setChevState(g, false));

  function showWheel(x, y) {
    wheel.style.left = x + 'px';
    wheel.style.top  = y + 'px';
    wheel.classList.add('visible');
    Object.values(chevGrps).forEach(g => setChevState(g, false));
  }

  function hideWheel() {
    wheel.classList.remove('visible');
    badge.classList.remove('visible');
  }

  function updateBadge(note, x, y) {
    badge.textContent = note;
    badge.style.left = x + 'px';
    badge.style.top  = y + 'px';
  }

  let prevOctaveSteps = 0;
  let prevHDir = 0;

  function onNoteChange(dx, dy) {
    const octaveSteps = Math.min(MAX_OCTAVE, Math.floor(Math.abs(dy) / OCTAVE_PX));
    const goingUp    = dy < 0 && octaveSteps > 0;
    const goingDown  = dy > 0 && octaveSteps > 0;
    const goingLeft  = dx <= -H_THRESHOLD;
    const goingRight = dx >= H_THRESHOLD;
    const hDir = goingLeft ? -1 : goingRight ? 1 : 0;

    setChevState(chevGrps.up,    goingUp);
    setChevState(chevGrps.down,  goingDown);
    setChevState(chevGrps.left,  goingLeft);
    setChevState(chevGrps.right, goingRight);

    if (octaveSteps !== prevOctaveSteps) {
      const decreasing = octaveSteps < prevOctaveSteps;
      if (octaveSteps > 0) nudgeChev(dy < 0 ? chevGrps.up : chevGrps.down, decreasing);
      prevOctaveSteps = octaveSteps;
    }
    if (hDir !== prevHDir) {
      if (hDir === -1) nudgeChev(chevGrps.left);
      if (hDir ===  1) nudgeChev(chevGrps.right);
      prevHDir = hDir;
    }
  }

  function noteFromGesture(baseLetter, dx, dy) {
    const octaveSteps = Math.min(MAX_OCTAVE, Math.floor(Math.abs(dy) / OCTAVE_PX));
    const goingUp = dy < 0;
    let note, octaveStr = '';
    if (goingUp) {
      note = octaveSteps === 0 ? baseLetter.toUpperCase() : baseLetter.toLowerCase();
      octaveStr = octaveSteps > 1 ? "'".repeat(octaveSteps - 1) : '';
    } else {
      note = baseLetter.toUpperCase();
      octaveStr = octaveSteps > 0 ? ','.repeat(octaveSteps) : '';
    }
    const accidental = dx >= H_THRESHOLD ? '^' : dx <= -H_THRESHOLD ? '_' : '';
    return accidental + note + octaveStr;
  }

  let gesture = null;

  function startGesture(btn, startX, startY) {
    const baseLetter = btn.dataset.insert;
    const insertPos  = savedStart;
    const insertEnd  = savedEnd;
    const initial    = baseLetter.toUpperCase();

    ta.value   = ta.value.slice(0, insertPos) + initial + ta.value.slice(insertEnd);
    savedStart = insertPos + initial.length;
    savedEnd   = savedStart;
    if (taFocused) ta.setSelectionRange(savedStart, savedEnd);
    else syncDisplayIfUnfocused();
    updateClearBtn();
    schedulePreview();

    btn.classList.add('pressed');

    const rect  = btn.getBoundingClientRect();
    const btnCX = rect.left + rect.width  / 2;
    const btnCY = rect.top  + rect.height / 2;

    prevOctaveSteps = 0;
    prevHDir = 0;

    const wheelTimer = setTimeout(() => {
      if (gesture) showWheel(btnCX, btnCY);
    }, WHEEL_DELAY);

    gesture = { btn, baseLetter, insertPos, startX, startY, lastNote: initial, wheelTimer, curX: startX, curY: startY };
  }

  function updateGesture(currentX, currentY) {
    if (!gesture) return;
    gesture.curX = currentX;
    gesture.curY = currentY;
    const dx   = currentX - gesture.startX;
    const dy   = currentY - gesture.startY;
    const note = noteFromGesture(gesture.baseLetter, dx, dy);
    if (note !== gesture.lastNote) {
      const start = gesture.insertPos;
      const end   = start + gesture.lastNote.length;
      ta.value   = ta.value.slice(0, start) + note + ta.value.slice(end);
      savedStart = start + note.length;
      savedEnd   = savedStart;
      if (taFocused) ta.setSelectionRange(savedStart, savedEnd);
      else syncDisplayIfUnfocused();
      gesture.lastNote = note;
      updateClearBtn();
      schedulePreview();
      if (wheel.classList.contains('visible')) {
        onNoteChange(dx, dy);
        badge.classList.add('visible');
      }
    }
    if (badge.classList.contains('visible')) updateBadge(gesture.lastNote, currentX, currentY);
  }

  function endGesture() {
    if (!gesture) return;
    clearTimeout(gesture.wheelTimer);
    hideWheel();
    const btn = gesture.btn;
    btn.classList.remove('pressed', 'shrink');
    void btn.offsetWidth;
    btn.classList.add('shrink');
    gesture = null;
  }

  // Touch move — new listener needed for gesture dragging
  document.addEventListener('touchmove', e => {
    if (!gesture) return;
    e.preventDefault();
    updateGesture(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  }, { passive: false });

  // Touch handling — press on touchstart, fire on touchend
  let activeBtn = null;
  document.addEventListener('touchstart', e => {
    const btn = e.target.closest('.key, .tmpl-btn, .action-btn');
    if (!btn) return;

    if (isNoteKey(btn)) {
      e.preventDefault();
      activeBtn = null; // gesture system takes over
      startGesture(btn, e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      return;
    }

    if (btn.classList.contains('key') || btn.classList.contains('tmpl-btn')) {
      e.preventDefault();
    } else if (btn.dataset.keepfocus) {
      if (taFocused) ta.focus();
    }
    activeBtn = btn;
    handleButtonPress(btn);
  }, { passive: false });

  document.addEventListener('touchend', e => {
    if (gesture) {
      endGesture();
      e.preventDefault();
      return;
    }
    if (!activeBtn) return;
    const touch = e.changedTouches[0];
    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    if (target && activeBtn.contains(target)) handleButtonRelease(activeBtn);
    activeBtn = null;
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchcancel', e => {
    if (gesture) { endGesture(); return; }
    activeBtn = null;
  }, { passive: true });

  // Mouse handling
  let activeMouseBtn = null;

  document.addEventListener('mousedown', e => {
    const btn = e.target.closest('.key, .tmpl-btn, .action-btn');
    if (!btn) return;

    if (isNoteKey(btn)) {
      e.preventDefault();
      activeMouseBtn = null;
      startGesture(btn, e.clientX, e.clientY);
      return;
    }

    if (btn.classList.contains('key') || btn.classList.contains('tmpl-btn') || btn.dataset.keepfocus) {
      e.preventDefault();
    }
    activeMouseBtn = btn;
    handleButtonPress(btn);
  });

  document.addEventListener('mousemove', e => {
    if (!gesture) return;
    updateGesture(e.clientX, e.clientY);
  });

  document.addEventListener('mouseup', e => {
    if (gesture) { endGesture(); return; }
    if (!activeMouseBtn) return;
    const btn = activeMouseBtn;
    activeMouseBtn = null;
    if (btn.contains(e.target)) handleButtonRelease(btn);
  });
</script>
</body>
</html>
