<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ABC Notepad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.4.4/abcjs-basic-min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #333;
    --accent: #e8c84a;
    --accent2: #4ae8b4;
    --text: #f0ede6;
    --text-dim: #888;
    --btn-bg: #222;
    --btn-bg-lg: #2a2a1a;
    --btn-border: #3a3a3a;
    --btn-border-lg: #5a5020;
    --radius: 8px;
    --radius-sm: 5px;
    /* Syntax highlighting */
    --hl-note:       #e8c84a; /* accent - note letters A-G */
    --hl-modifier:   #e8964a; /* orange  - accidentals ^ _ = , ' and dot */
    --hl-rest:       #4ae8b4; /* accent2 - z x Z */
    --hl-duration:   #7ab8e8; /* blue    - digits and / */
    --hl-barline:    #666;    /* dim     - | barlines */
    --hl-chord:      #b48ae8; /* purple  - "chord symbols" */
    --hl-decoration: #e8a84a; /* amber   - !decoration! */
    --hl-header:     #888;    /* dim     - header field keys T: K: M: etc */
    --hl-directive:  #555;    /* dimmer  - %% directives */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 10px;
    gap: 7px;
    max-width: 640px;
    margin: 0 auto;
  }

  header {
    padding: 2px 0 2px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }

  .btn-settings {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: var(--radius-sm);
    padding: 5px 10px;
    font-size: 0.75rem;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.04em;
    touch-action: manipulation;
  }
  .btn-settings.active { border-color: var(--accent); color: var(--accent); }
  .header-btns { display: flex; gap: 6px; }

  /* Zoom panel */
  #zoom-panel {
    display: none;
    position: absolute;
    top: 32px;
    right: 10px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 2px 10px 10px;
    z-index: 50;
    width: 160px;
  }
  #zoom-panel.open { display: block; }
  #zoom-slider {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
    height: 4px;
  }

  /* Settings modal */
  #settings-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #settings-overlay.open { display: flex; }
  #modal-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    width: 100%;
    max-width: 500px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--accent);
  }
  .modal-close {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 2px 6px;
    line-height: 1;
    touch-action: manipulation;
  }
  .modal-setting {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .modal-setting-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-setting-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .modal-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }
  .modal-toggle input[type="checkbox"] {
    accent-color: var(--accent);
    width: 16px;
    height: 16px;
    cursor: pointer;
  }
  .modal-wrap-fields {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .modal-wrap-fields.disabled { opacity: 0.4; pointer-events: none; }
  .modal-field-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
  }
  .modal-textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    line-height: 1.5;
    padding: 7px 9px;
    resize: vertical;
    min-height: 56px;
  }
  .modal-textarea:focus { outline: none; border-color: var(--accent); }

  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 1rem;
    color: var(--accent);
    letter-spacing: 0.05em;
  }
  .logo { text-decoration: none; }
  .logo span { color: var(--text-dim); font-weight: 400; }

  /* Static cursor in editor display view */
  .editor-cursor {
    position: absolute;
    top: 0.07em;
    right: -2px;
    width: 2px;
    height: 1.15em;
    background: #fff;
    border-radius: 1px;
    pointer-events: none;
  }

  /* Static editor display (shown when textarea is unfocused) */
  #notation-display {
    display: none;
    width: 100%;
    min-height: 90px;
    max-height: 160px;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
    line-height: 1.6;
    padding: 10px 12px;
    box-sizing: border-box;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    overflow-y: auto;
    cursor: text;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  #notation-display.active { display: block; }
  #notation-display .display-placeholder { color: var(--text-dim); }
  #notation-display .hl-sel {
    background: rgba(232, 200, 74, 0.28);
    border-radius: 2px;
  }
  #notation-display .hl-mod   { color: var(--hl-modifier); }
  #notation-display .hl-rest  { color: var(--hl-rest); }
  #notation-display .hl-dur   { color: var(--hl-duration); }
  #notation-display .hl-bar   { color: var(--hl-barline); }
  #notation-display .hl-chord { color: var(--hl-chord); }
  #notation-display .hl-deco  { color: var(--hl-decoration); }
  #notation-display .hl-hkey  { color: var(--hl-header); }
  #notation-display .hl-hval  { color: var(--text-dim); }
  #notation-display .hl-dir   { color: var(--hl-directive); }
  #notation-display .hl-header{ color: var(--hl-header); }
  #notation.hidden { display: none; }

  .btn-undo {
    background: transparent;
    border: none;
    padding: 4px 6px;
    opacity: 1;
    transition: opacity 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-undo:hover { background: transparent; }
  .btn-undo:disabled { opacity: 0.25; cursor: default; }
  .btn-undo svg { display: block; }
  #preview { padding: 8px 10px; overflow-x: auto; overflow-y: hidden; }
  #preview svg { display: block; }
  #preview svg path, #preview svg rect, #preview svg ellipse,
  #preview svg polygon, #preview svg line, #preview svg polyline {
    fill: var(--text); stroke: var(--text);
  }
  #preview svg [fill="none"] { fill: none; }
  #preview svg [stroke="none"] { stroke: none; }
  #preview svg .mark path,
  #preview svg .mark rect,
  #preview svg .mark ellipse,
  #preview svg .mark polygon,
  #preview svg .mark line {
    fill: var(--accent) !important;
    stroke: var(--accent) !important;
  }

  /* Editor */
  .editor-wrap {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    position: relative;
  }

  /* Tie autocomplete tooltip */
  #tie-tooltip {
    display: none;
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface2);
    border: 1.5px solid var(--accent);
    border-radius: var(--radius-sm);
    padding: 6px 8px 6px 14px;
    align-items: center;
    gap: 10px;
    z-index: 60;
    white-space: nowrap;
    box-shadow: 0 4px 18px rgba(0,0,0,0.45);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #tie-tooltip.visible { display: flex; }
  #tie-tooltip-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.04em;
  }
  #tie-tooltip-close {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 0.8rem;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
    touch-action: manipulation;
    border-radius: 3px;
    flex-shrink: 0;
  }
  #tie-tooltip-close:hover { color: var(--text); }
  /* Downward-pointing arrow */
  #tie-tooltip::after {
    content: '';
    position: absolute;
    bottom: -7px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 7px solid var(--accent);
  }
  #notation {
    border-radius: var(--radius) var(--radius) 0 0;
  }
  #notation {
    display: block;
    width: 100%;
    min-height: 90px;
    max-height: 160px;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
    line-height: 1.6;
    padding: 10px 12px;
    resize: vertical;
    caret-color: var(--accent);
  }
  #notation::placeholder { color: var(--text-dim); }

  .editor-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 8px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    gap: 6px;
  }
  .footer-left { display: flex; gap: 6px; }
  .footer-right { display: flex; gap: 6px; }

  .action-btn {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    transition: background 0.08s, transform 0.08s;
    letter-spacing: 0.04em;
    touch-action: manipulation;
  }
  .btn-copy { background: var(--accent); color: #111; }
  .btn-clear { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-templates { background: transparent; color: var(--text); border: 1px solid var(--border); font-size: 1.1rem; padding: 4px 9px; }
  .btn-templates.active { background: var(--surface2); border-color: var(--text-dim); }

  .arrow-btns { display: flex; gap: 3px; }
  .btn-arrow {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: var(--radius-sm);
    padding: 5px 8px;
    font-size: 0.7rem;
    cursor: pointer;
    touch-action: manipulation;
    font-family: 'IBM Plex Sans', sans-serif;
    line-height: 1;
  }

  /* Arrow key row — below keyboard, left-aligned */
  .row-arrows {
    justify-content: flex-start;
    gap: 4px;
  }
  .row-arrows .key {
    flex: 0 0 auto;
    width: 48px;
    height: 36px;
    font-size: 1rem;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* Chord + text insert buttons */
  .btn-chord {
    background: transparent;
    color: var(--text);
    border: none;
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0;
    padding: 4px 8px;
    line-height: 1;
  }
  .btn-chord sup {
    font-size: 0.6em;
    font-style: normal;
    vertical-align: super;
    font-weight: 600;
  }
  .btn-addtext {
    background: transparent;
    color: var(--text);
    border: none;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1rem;
    font-weight: 700;
    padding: 4px 8px;
    line-height: 1;
  }
  .btn-addtext .t-arrow {
    font-style: normal;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.52em;
    font-weight: 400;
    position: relative;
    margin-left: 1px;
    color: var(--text);
  }
  .btn-addtext .t-arrow-up   { top: -0.2em; }

  /* Insert popups */
  .insert-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .insert-overlay.open { display: flex; }
  .insert-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    width: 100%;
    max-width: 340px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .insert-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--accent);
  }
  .insert-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
    padding: 9px 12px;
    outline: none;
    caret-color: var(--accent);
  }
  .insert-input:focus { border-color: var(--accent); }
  .insert-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* Context menu (hamburger) */
  .menu-wrap {
    position: relative;
  }
  .menu-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: visible;
    z-index: 50;
    white-space: nowrap;
    min-width: 170px;
  }
  .menu-dropdown.open { display: block; }
  .menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 9px 14px;
    text-align: left;
    cursor: pointer;
    letter-spacing: 0.04em;
    touch-action: manipulation;
    box-sizing: border-box;
  }
  .menu-item:hover { background: var(--surface2); }
  .menu-item.danger { color: #e06060; }
  .menu-item-arrow { opacity: 0.5; font-size: 0.7rem; margin-left: 12px; }
  .menu-divider { height: 1px; background: var(--border); margin: 3px 0; }

  /* Tools submenu */
  .menu-submenu-wrap {
    position: relative;
  }
  .menu-submenu {
    display: none;
    position: absolute;
    top: -2px;
    left: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    z-index: 51;
    white-space: nowrap;
    min-width: 190px;
  }
  .menu-submenu.open { display: block; }
  .submenu-sel-preview {
    padding: 7px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .submenu-sel-preview.has-sel { color: var(--accent2); }
  .submenu-sel-preview.no-sel  { font-style: italic; }
  .submenu-item {
    display: block;
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 8px 14px;
    text-align: left;
    cursor: pointer;
    letter-spacing: 0.04em;
    touch-action: manipulation;
  }
  .submenu-item:hover { background: var(--surface2); }

  /* Template popover overlay */
  #tmpl-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #tmpl-overlay.open { display: flex; }
  #tmpl-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    width: 100%;
    max-width: 400px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-height: 80vh;
    overflow-y: auto;
  }
  #tmpl-box .insert-title { margin-bottom: 2px; }
  .tmpl-overlay-grid { display: flex; flex-wrap: wrap; gap: 5px; }

  /* Split copy button */
  .copy-split {
    display: flex;
    position: relative;
  }
  .copy-split .btn-copy-main {
    background: var(--accent);
    color: #111;
    border: none;
    border-radius: var(--radius-sm) 0 0 var(--radius-sm);
    padding: 5px 12px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    touch-action: manipulation;
  }
  .copy-split-divider {
    width: 1px;
    background: rgba(0,0,0,0.25);
    flex-shrink: 0;
  }
  .copy-split .btn-copy-arrow {
    background: var(--accent);
    color: #111;
    border: none;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 5px 7px;
    font-size: 0.6rem;
    cursor: pointer;
    touch-action: manipulation;
    display: flex;
    align-items: center;
  }
  .copy-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    z-index: 50;
    white-space: nowrap;
    min-width: 100%;
  }
  .copy-dropdown.open { display: block; }
  .copy-dropdown-item {
    display: block;
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 8px 14px;
    text-align: left;
    cursor: pointer;
    letter-spacing: 0.04em;
    touch-action: manipulation;
  }
  .copy-dropdown-item:hover { background: var(--surface2); }

  /* Template panel - removed (now a popover overlay) */
  .tmpl-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(0.65rem, 2.4vw, 0.8rem);
    font-weight: 600;
    background: var(--btn-bg);
    color: var(--accent2);
    border: 1.5px solid #2a5a4a;
    border-radius: var(--radius-sm);
    padding: 7px 10px;
    cursor: pointer;
    transition: background 0.08s, transform 0.08s;
    white-space: nowrap;
    touch-action: manipulation;
  }

  .copy-toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-60px);
    background: var(--accent2);
    color: #0a2a1f;
    font-weight: 600;
    font-size: 0.8rem;
    padding: 8px 20px;
    border-radius: 20px;
    transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 999;
    white-space: nowrap;
  }
  .copy-toast.show { transform: translateX(-50%) translateY(0); }

  /* Key rows */
  .key-row {
    display: flex;
    flex-wrap: nowrap;
    gap: 4px;
    width: 100%;
  }
  .key {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    border: 1.5px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--text);
    border-radius: var(--radius-sm);
    cursor: pointer;
    user-select: none;
    transition: background 0.08s, transform 0.08s;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    flex: 1 1 0;
    min-width: 0;
    padding: 0;
    white-space: nowrap;
    overflow: hidden;
    touch-action: manipulation;
  }
  @keyframes keyflash {
    0%   { background: #556; transform: scale(0.88); }
    40%  { background: #445; }
    100% { background: var(--btn-bg); transform: scale(1); }
  }
  @keyframes keyflash-primary {
    0%   { background: #4a4520; transform: scale(0.88); }
    40%  { background: #3a3518; }
    100% { background: var(--btn-bg-lg); transform: scale(1); }
  }
  @keyframes keyflash-bksp {
    0%   { background: #3a1515; transform: scale(0.88); }
    100% { background: #1e1010; transform: scale(1); }
  }
  @keyframes btnflash {
    0%   { opacity: 0.6; transform: scale(0.94); }

  /* Gesture note badge */

    display: none;

  .chev-path {

  @keyframes nudge-up        { 0%{transform:translateY(0)} 35%{transform:translateY(-5px)} 100%{transform:translateY(0)} }

<script>
  const ta = document.getElementById('notation');
  const toast = document.getElementById('toast');
  const previewDiv = document.getElementById('preview');

  let taFocused = false;
  let savedStart = 0, savedEnd = 0;

  // --- Tie autocomplete tooltip ---
  let tieTooltipActive = false;
  let tieTooltipSuggestion = '';
  const tieTooltipEl    = document.getElementById('tie-tooltip');
  const tieTooltipText  = document.getElementById('tie-tooltip-text');
  const tieTooltipClose = document.getElementById('tie-tooltip-close');

  function showTieTooltip(suggestion) {
    tieTooltipSuggestion = suggestion;
    tieTooltipActive = true;
    tieTooltipText.textContent = suggestion;
    tieTooltipEl.classList.add('visible');
  }

  function hideTieTooltip() {
    if (!tieTooltipActive) return;
    tieTooltipActive = false;
    tieTooltipSuggestion = '';
    tieTooltipEl.classList.remove('visible');
  }

  // Parse backwards from savedStart to find a tie autocomplete suggestion.
  // Returns the suggestion string, or null if context is invalid.
  function getTieSuggestion() {
    // No suggestion if there's a selection
    if (savedStart !== savedEnd) return null;

    const val = ta.value;
    const pos = savedStart;

    // Use full text up to cursor — ties can span system breaks (newlines),
    // and the stripping loop handles \n as whitespace.
    let s = val.slice(0, pos);

    // Iteratively strip allowed gap characters from the right:
    // whitespace (including \n), barlines, complete quoted strings "...",
    // unclosed/partial quoted strings (e.g. user mid-typing "G7),
    // and decorations !...!
    let progress = true;
    while (progress) {
      progress = false;
      // Trailing whitespace (including newlines)
      if (/\s$/.test(s)) {
        s = s.replace(/\s+$/, '');
        progress = true; continue;
      }
      // Trailing complete quoted string "..."
      if (/"[^"]*"$/.test(s)) {
        s = s.replace(/"[^"]*"$/, '');
        progress = true; continue;
      }
      // Trailing unclosed/partial quoted string — only when inside an open quote
      // (odd number of " means one is unclosed; even means all are closed)
      if ((s.match(/"/g) || []).length % 2 === 1) {
        s = s.replace(/"[^"]*$/, '');
        progress = true; continue;
      }
      // Trailing complete decoration !...!
      if (/![^!\n]+!$/.test(s)) {
        s = s.replace(/![^!\n]+!$/, '');
        progress = true; continue;
      }
      // Trailing unclosed/partial decoration — only when inside an open decoration
      if ((s.match(/!/g) || []).length % 2 === 1) {
        s = s.replace(/![^!]*$/, '');
        progress = true; continue;
      }
      // Trailing barlines (various forms, longest match first)
      if (/(:\|::|::\|:|:\|\|:|:\|\||\|\|:|\|\||::\||::\||\[\|\||:\||:\]|\|\]|\[?\||\|:|:])$/.test(s)) {
        s = s.replace(/(:\|::|::\|:|:\|\|:|:\|\||\|\|:|\|\||::\||::\||\[\|\||:\||:\]|\|\]|\[?\||\|:|:])$/, '');
        progress = true; continue;
      }
    }

    // Must end with a hyphen
    if (!s.endsWith('-')) return null;
    s = s.slice(0, -1);

    // Try to match a chord at end of s:
    // Optional . prefix, [ not followed by inline field (letter:), note chars, ], optional duration
    const chordMatch = s.match(/\.?\[(?![A-Za-z]:)([^\]\n]+)\](?:[0-9]+\/[0-9]*|\/[0-9]*|[0-9]+|\/)*$/);
    if (chordMatch) {
      const stripped = chordMatch[1].replace(/[_^=]/g, '');
      if (!stripped || !/[a-gA-G]/.test(stripped)) return null;
      return '[' + stripped + ']';
    }

    // Try to match a single note at end of s:
    // Optional . prefix, optional accidentals, note letter, optional octave markers, optional duration
    const noteMatch = s.match(/\.?[_^=]*([a-gA-G])([',]*)(?:[0-9]+\/[0-9]*|\/[0-9]*|[0-9]+|\/)*$/);
    if (noteMatch) {
      return noteMatch[1] + noteMatch[2];
    }

    return null;
  }

  function tryShowTieTooltip() {
    const suggestion = getTieSuggestion();
    if (suggestion) showTieTooltip(suggestion);
  }

  function checkTieTooltipValidity() {
    if (!tieTooltipActive) return;
    const suggestion = getTieSuggestion();
    if (!suggestion) {
      hideTieTooltip();
    } else if (suggestion !== tieTooltipSuggestion) {
      // Cursor moved to a different valid tie context — update suggestion
      tieTooltipSuggestion = suggestion;
      tieTooltipText.textContent = suggestion;
    }
  }

  function acceptTieSuggestion() {
    if (!tieTooltipActive || !tieTooltipSuggestion) return;
    const suggestion = tieTooltipSuggestion;
    hideTieTooltip();
    doInsert(suggestion, taFocused); // separate undo step (doInsert calls pushUndo)
  }

  // Tooltip body tap/click → accept; X → dismiss
  tieTooltipEl.addEventListener('mousedown', e => {
    e.preventDefault(); // prevent textarea blur

  // --- Undo ---
  const MAX_UNDO = 100;
  const undoStack = [];
  const undoBtn = document.getElementById('undoBtn');

  function pushUndo() {
    undoStack.push({ value: ta.value, selStart: savedStart, selEnd: savedEnd });
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    undoBtn.disabled = false;
  }

  function undo() {
    if (!undoStack.length) return;
    const state = undoStack.pop();
    ta.value = state.value;
    savedStart = state.selStart;
    savedEnd   = state.selEnd;
    if (taFocused) {
      ta.setSelectionRange(savedStart, savedEnd);
    } else {
      syncDisplayIfUnfocused();

    updateClearBtn();
    schedulePreview();
    undoBtn.disabled = undoStack.length === 0;
    checkTieTooltipValidity();

  let debounceTimer = null;

  const taDisplay = document.getElementById('notation-display');

  // ---- ABC syntax highlighting tokeniser ----
  // Returns array of {type, text} objects covering every character in val.
  function tokeniseABC(val) {
    const tokens = [];
    // Line-scoped pass: identify header lines and directive lines first,
    // then fall through to the character-level regex for body content.
    const lines = val.split('\n');
    for (let li = 0; li < lines.length; li++) {
      const line = lines[li];
      const nl = li < lines.length - 1 ? '\n' : '';

      // Header field: letter followed by colon at start of line (e.g. T:, K:, M:)
      const headerMatch = line.match(/^([A-Za-z]:)(.*)/);
      // %% directive line
      const directiveMatch = !headerMatch && line.match(/^(%%)(.*)/);
      // % comment line
      const commentMatch = !headerMatch && !directiveMatch && line.match(/^(%)(.*)/);

      if (headerMatch) {
        tokens.push({ type: 'header-key',   text: headerMatch[1] });
        if (headerMatch[2]) tokens.push({ type: 'header-val', text: headerMatch[2] });
        if (nl) tokens.push({ type: 'plain', text: nl });
        continue;
      }
      if (directiveMatch) {
        tokens.push({ type: 'directive', text: '%%' + directiveMatch[2] });
        if (nl) tokens.push({ type: 'plain', text: nl });
        continue;
      }
      if (commentMatch) {
        tokens.push({ type: 'directive', text: '%' + commentMatch[2] });
        if (nl) tokens.push({ type: 'plain', text: nl });
        continue;
      }

      // Body line: character-level tokenisation
      // Order matters — longer/more-specific patterns first.
      const bodyRe = new RegExp(
        '"[^"]*"'          + '|' +  // chord symbols "Gm7"
        '![^!\\n]+!'       + '|' +  // decorations !trill!
        '\\[\\s*[A-Za-z]:' +         // inline fields [K:C] [V:1]
          '[^\\]]*\\]'     + '|' +
        '\\|\\||\\|:|:\\|' + '|' +  // double/repeat barlines
        '\\[\\|\\||\\[\\|' + '|' +  // thick-thin barlines
        '\\|\\]|::'        + '|' +  // thin-thick, double-repeat
        '\\|'              + '|' +  // single barline
        '[a-gA-G]'         + '|' +  // note letters
        '[zxZ]'            + '|' +  // rests
        '[\\^_=]'          + '|' +  // accidentals
        "[\\',]"           + '|' +  // octave markers
        '\\.'              + '|' +  // augmentation dot
        '[0-9]+\\/[0-9]*'  + '|' +  // fractional durations 3/2 1/
        '\\/[0-9]*'        + '|' +  // leading-slash durations /2 /
        '[0-9]+'           + '|' +  // plain numbers
        '[-]'              + '|' +  // tie
        '[><]'             + '|' +  // broken rhythm
        '[()]'             + '|' +  // slur
        '[\\s\\S]',                  // catch-all (one char)
        'g'
      );

      let m;
      while ((m = bodyRe.exec(line)) !== null) {
        const t = m[0];
        let type = 'plain';
        if (t.startsWith('"'))                          type = 'chord';
        else if (t.startsWith('!'))                     type = 'decoration';
        else if (t.startsWith('[') && t.includes(':'))  type = 'inline-field';
        else if (/^(\|\||:\||\|:|:\:|\\[\\|\\||\[\\|\|\\]|::)/.test(t)) type = 'barline';
        else if (t === '|')                             type = 'barline';
        else if (/^[a-gA-G]$/.test(t))                 type = 'note';
        else if (/^[zxZ]$/.test(t))                    type = 'rest';
        else if (/^[\^_=]$/.test(t))                   type = 'modifier';
        else if (/^[',]$/.test(t))                     type = 'modifier';
        else if (t === '.')                             type = 'modifier';
        else if (/^[0-9]/.test(t) || t.startsWith('/'))type = 'duration';
        else if (t === '-')                             type = 'tie';
        else if (/^[><()]$/.test(t))                   type = 'duration';
        tokens.push({ type, text: t });
      }
      if (nl) tokens.push({ type: 'plain', text: nl });
    }
    return tokens;
  }

  const TYPE_CLASS = {
    'note':         'hl-note',
    'modifier':     'hl-mod',
    'rest':         'hl-rest',
    'duration':     'hl-dur',
    'tie':          'hl-dur',
    'barline':      'hl-bar',
    'chord':        'hl-chord',
    'decoration':   'hl-deco',
    'inline-field': 'hl-header',
    'header-key':   'hl-hkey',
    'header-val':   'hl-hval',
    'directive':    'hl-dir',
    'plain':        '',
  };

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function tokensToHTML(tokens, selStart, selEnd) {
    const hasSel = selEnd > selStart;
    const cursorSpan = '<span class="editor-cursor"></span>';

    function charWithCursor(ch) {
      return `<span style="position:relative;display:inline">${esc(ch)}${cursorSpan}</span>`;
    }

    // Render a fragment of token text, optionally wrapped in a class span,
    // optionally wrapped in a selection highlight span.
    function renderFragment(text, cls, inSel) {
      if (!text) return '';
      let inner = cls ? `<span class="${cls}">${esc(text)}</span>` : esc(text);
      if (inSel) inner = `<span class="hl-sel">${inner}</span>`;
      return inner;
    }

    // Split a token at up to two boundary points (selStart, selEnd) and
    // render each piece with correct highlighting.
    function renderToken(tok, charCount) {
      const cls  = TYPE_CLASS[tok.type] || '';
      const text = tok.text;
      const len  = text.length;
      const tokStart = charCount;
      const tokEnd   = charCount + len;

      if (!hasSel) {
        // No selection — normal render (cursor handled separately below)
        return cls ? `<span class="${cls}">${esc(text)}</span>` : esc(text);
      }

      // Clamp selection to this token's range
      const sA = Math.max(selStart, tokStart) - tokStart; // start offset within token
      const sB = Math.min(selEnd,   tokEnd)   - tokStart; // end offset within token

      if (sA >= sB) {
        // Token entirely outside selection
        return renderFragment(text, cls, false);
      }
      if (sA === 0 && sB === len) {
        // Token entirely inside selection
        return renderFragment(text, cls, true);
      }
      // Token straddles a boundary — split into up to 3 pieces
      let html = '';
      if (sA > 0)   html += renderFragment(text.slice(0, sA), cls, false);
                    html += renderFragment(text.slice(sA, sB), cls, true);
      if (sB < len) html += renderFragment(text.slice(sB), cls, false);
      return html;
    }

    if (hasSel) {
      // Selection mode — no cursor, just highlighted ranges
      let html = '';
      let charCount = 0;
      for (const tok of tokens) {
        html += renderToken(tok, charCount);
        charCount += tok.text.length;
      }
      return html;
    }

    // Cursor mode — single insertion point
    const cursorPos = selStart;
    let html = '';
    let charCount = 0;
    let cursorInserted = false;

    for (let ti = 0; ti < tokens.length; ti++) {
      const tok = tokens[ti];
      const cls = TYPE_CLASS[tok.type] || '';
      const len = tok.text.length;
      const tokStart = charCount;
      const tokEnd   = charCount + len;

      if (!cursorInserted && cursorPos >= tokStart && cursorPos < tokEnd) {
        const split = cursorPos - tokStart;
        if (split === 0) {
          const firstChar = tok.text[0] || '';
          const rest = tok.text.slice(1);
          const anchor = `<span style="position:relative;display:inline">${esc(firstChar)}<span class="editor-cursor" style="right:auto;left:-2px"></span></span>`;
          html += cls ? `<span class="${cls}">${anchor}${esc(rest)}</span>` : anchor + esc(rest);
        } else {
          const pre      = tok.text.slice(0, split);
          const post     = tok.text.slice(split);
          const preRest  = pre.slice(0, -1);
          const anchorCh = pre.slice(-1);
          const anchor   = charWithCursor(anchorCh);
          if (cls) {
            html += `<span class="${cls}">${esc(preRest)}${anchor}</span>`;
            if (post) html += `<span class="${cls}">${esc(post)}</span>`;
          } else {
            html += esc(preRest) + anchor + esc(post);
          }
        }
        cursorInserted = true;
      } else {
        html += cls ? `<span class="${cls}">${esc(tok.text)}</span>` : esc(tok.text);
      }
      charCount = tokEnd;
    }
    if (!cursorInserted) {
      html += `<span style="position:relative;display:inline">&#8203;${cursorSpan}</span>`;
    }
    return html;
  }

  function renderStaticDisplay() {
    const val = ta.value;
    if (!val) {
      taDisplay.innerHTML = '<span class="display-placeholder">' + esc(ta.placeholder) + '</span>';
    } else {
      const tokens = tokeniseABC(val);
      taDisplay.innerHTML = tokensToHTML(tokens, savedStart, savedEnd);
    }
  }

  function scrollCursorIntoView() {
    const cursor = taDisplay.querySelector('.editor-cursor');
    if (!cursor) return;
    const cursorRect  = cursor.getBoundingClientRect();
    const displayRect = taDisplay.getBoundingClientRect();
    const offsetTop   = cursorRect.top - displayRect.top + taDisplay.scrollTop;
    const cursorH     = cursorRect.height || 16;
    const divH        = taDisplay.clientHeight;
    const pad         = 8;
    const scroll      = taDisplay.scrollTop;
    if (offsetTop - pad < scroll) {
      taDisplay.scrollTop = Math.max(0, offsetTop - pad);
    } else if (offsetTop + cursorH + pad > scroll + divH) {
      taDisplay.scrollTop = offsetTop + cursorH + pad - divH;
    }
  }

  // Show/hide static display — capture scroll at the moment of transition, apply after swap
  function syncDisplayIfUnfocused() {
    if (!taFocused) {
      if (!taDisplay.classList.contains('active')) {
        renderStaticDisplay();
        taDisplay.style.height = ta.offsetHeight + 'px';
        taDisplay.scrollTop = ta.scrollTop;
        ta.classList.add('hidden');
        taDisplay.classList.add('active');
      } else {
        renderStaticDisplay();
        scrollCursorIntoView();
      }
    }
  }

  function showStaticDisplay() {
    const scroll = ta.scrollTop;
    renderStaticDisplay();
    taDisplay.style.height = ta.offsetHeight + 'px';
    ta.classList.add('hidden');
    taDisplay.classList.add('active');
    requestAnimationFrame(() => { taDisplay.scrollTop = scroll; });
  }

  function hideStaticDisplay() {
    if (!taDisplay.classList.contains('active')) return;
    const scroll = taDisplay.scrollTop;
    taDisplay.classList.remove('active');
    ta.classList.remove('hidden');
    requestAnimationFrame(() => { ta.scrollTop = scroll; });
  }

  // Tapping the display div refocuses the textarea.
  // Mouse: on mousedown (instant). Touch: on touchend so the div is
  // scrollable on mobile without accidentally triggering focus.
  taDisplay.addEventListener('mousedown', e => {
    e.preventDefault();
    hideStaticDisplay();
    ta.focus();
    ta.setSelectionRange(savedStart, savedEnd);
  });

  let touchStartY = 0;
  taDisplay.addEventListener('touchstart', e => {
    touchStartY = e.changedTouches[0].clientY;
  }, { passive: true });
  taDisplay.addEventListener('touchend', e => {
    const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
    if (dy > 8) return;
    e.preventDefault();
    hideStaticDisplay();
    ta.focus();
    ta.setSelectionRange(savedStart, savedEnd);
  }, { passive: false });

  const rowLetters = document.getElementById('row-letters');
  const rowNumbers = document.getElementById('row-numbers');

  function setTypingRows(focused) {
    const v = focused ? 'none' : '';
    rowLetters.style.display = v;
    rowNumbers.style.display = v;
  }

  ta.addEventListener('focus', () => { taFocused = true; hideStaticDisplay(); setTypingRows(true); });
  ta.addEventListener('blur', () => {
    taFocused = false;
    savedStart = ta.selectionStart;
    savedEnd = ta.selectionEnd;
    if (!popupOpen) showStaticDisplay();
    setTypingRows(false);
  });
  ta.addEventListener('keyup', () => {
    if (taFocused) { savedStart = ta.selectionStart; savedEnd = ta.selectionEnd; }
  });
  ta.addEventListener('click', () => {
    if (taFocused) { savedStart = ta.selectionStart; savedEnd = ta.selectionEnd; }
  });
  ta.addEventListener('mouseup', () => {
    if (taFocused) { savedStart = ta.selectionStart; savedEnd = ta.selectionEnd; }
  });
  document.addEventListener('selectionchange', () => {
    if (taFocused) {
      savedStart = ta.selectionStart;
      savedEnd = ta.selectionEnd;
      checkTieTooltipValidity();
    }
  });
  function updateClearBtn() {
    // Reset menu item greyed out when empty
    // (no clearBtn DOM element anymore — just keep for callers)
  }
  updateClearBtn();
  syncDisplayIfUnfocused();
  setTypingRows(false);

  ta.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
      e.preventDefault();
      undo();
      return;
    }
    if (e.key === 'Escape' && tieTooltipActive) {
      hideTieTooltip();
      return;
    }
    // Push before any character-modifying key
    const modifying = e.key.length === 1 || e.key === 'Backspace' || e.key === 'Delete';
    if (modifying && !e.ctrlKey && !e.metaKey && !e.altKey) pushUndo();
  });
  ta.addEventListener('input', e => {
    savedStart = ta.selectionStart;
    savedEnd   = ta.selectionEnd;
    schedulePreview();
    if (e.inputType === 'insertText' && e.data === '-') {
      tryShowTieTooltip();
    } else {
      checkTieTooltipValidity();
    }
  });

  const zoomSlider = document.getElementById('zoom-slider');
  let zoomLevel = 0.5;

  const BASE_MULTIPLIER = 1.45;
  const SCALING_FACTOR = 1.4;

  function getStaffwidth() {
    const containerWidth = previewDiv.offsetWidth || 320;
    const multiplier = BASE_MULTIPLIER - (zoomLevel - 0.5) * SCALING_FACTOR;
    return Math.round(containerWidth * multiplier);
  }

  zoomSlider.addEventListener('input', () => {
    zoomLevel = parseFloat(zoomSlider.value);
    renderPreview();
  });

  function schedulePreview() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(renderPreview, 900);
  }

  function renderPreview() {
    const raw = ta.value.trim();
    if (!raw) { previewDiv.innerHTML = ''; return; }
    try {
      ABCJS.renderAbc('preview', raw, {
        responsive: 'resize',
        staffwidth: getStaffwidth(),
        add_classes: true,
        paddingtop: 6, paddingbottom: 6, paddingleft: 8, paddingright: 8,
        jazzchords: false,
        format: { gchordfont: 'Helvetica 12' }
      });
    } catch(e) {}
  }

  // Core insert — used by both key buttons and template buttons
  function doInsert(text, refocus) {
    pushUndo();
    const s = savedStart;
    const e = savedEnd;
    const atEnd = e === ta.value.length;
    ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
    savedStart = s + text.length;
    savedEnd = savedStart;
    if (refocus) {
      ta.focus();
      ta.setSelectionRange(savedStart, savedEnd);
    } else if (!taFocused) {
      syncDisplayIfUnfocused();
    }
    if (atEnd) ta.scrollTop = ta.scrollHeight;
    updateClearBtn();
    schedulePreview();
    if (text === '-') {
      tryShowTieTooltip();
    } else {
      checkTieTooltipValidity();
    }
  }

  function bksp() {
    pushUndo();
    const wasActive = taFocused;
    const atEnd = savedEnd === ta.value.length;
    if (savedStart === savedEnd && savedStart > 0) {
      ta.value = ta.value.slice(0, savedStart - 1) + ta.value.slice(savedEnd);
      savedStart -= 1; savedEnd = savedStart;
    } else if (savedStart !== savedEnd) {
      ta.value = ta.value.slice(0, savedStart) + ta.value.slice(savedEnd);
      savedEnd = savedStart;
    }
    if (wasActive) { ta.focus(); ta.setSelectionRange(savedStart, savedEnd); }
    else syncDisplayIfUnfocused();
    if (atEnd) ta.scrollTop = ta.scrollHeight;
    updateClearBtn();
    schedulePreview();
    checkTieTooltipValidity();
  }

  function moveCursor(key) {
    const wasFocused = taFocused;
    const s = savedStart;
    const val = ta.value;
    let pos;
    if (key === 'ArrowLeft') {
      pos = s > 0 ? s - 1 : 0;
    } else if (key === 'ArrowRight') {
      pos = s < val.length ? s + 1 : val.length;
    } else {
      const lines = val.split('\n');
      let line = 0, col = 0, count = 0;
      for (let i = 0; i < lines.length; i++) {
        if (count + lines[i].length >= s) { line = i; col = s - count; break; }
        count += lines[i].length + 1;
      }
      if (key === 'ArrowUp') {
        pos = line === 0 ? 0 : lines.slice(0, line - 1).reduce((a, l) => a + l.length + 1, 0) + Math.min(col, lines[line - 1].length);
      } else {
        pos = line === lines.length - 1 ? val.length : lines.slice(0, line + 1).reduce((a, l) => a + l.length + 1, 0) + Math.min(col, lines[line + 1].length);
      }
    }
    savedStart = pos; savedEnd = pos;
    if (wasFocused) ta.setSelectionRange(pos, pos);
    else syncDisplayIfUnfocused();
    checkTieTooltipValidity();
  }

  function arrowLeft()  { moveCursor('ArrowLeft');  }
  function arrowRight() { moveCursor('ArrowRight'); }
  function arrowUp()    { moveCursor('ArrowUp');    }
  function arrowDown()  { moveCursor('ArrowDown');  }

  document.addEventListener('touchstart', e => {

  // Template overlay
  let tmplPrevFocused = false;
  function openTmplOverlay() {

  function copyText() {

  function copyTextRaw() {

  document.getElementById('wrapBefore').value = "```abc\n{\"staffwidth\": 500}\n---\n%%MIDI gchord \"none\"";
  document.getElementById('wrapAfter').value = "```";

  // Transpose a single note token one octave up or down.
  // A note token is: optional accidental(s), note letter, optional octave markers (',+)
  // Up:   C→c, c→c', c'→c'', C,→C, C,,→C, (bottom out at C/A-G uppercase with commas, shift up one)
  // Down: c''→c', c'→c, c→C, C→C,
  function transposeNoteUp(acc, letter, octs) {
    // octs is the string of ' and , after the note letter
    const commas = (octs.match(/,/g) || []).length;
    const ticks  = (octs.match(/'/g) || []).length;
    if (commas > 0) {
      // e.g. C,, → C, → C
      return acc + letter.toUpperCase() + ','.repeat(commas - 1);
    } else if (letter === letter.toUpperCase()) {
      // uppercase, no commas → go to lowercase
      return acc + letter.toLowerCase() + "'".repeat(ticks);
    } else {
      // lowercase → add a tick
      return acc + letter.toLowerCase() + "'".repeat(ticks + 1);
    }
  }

  function transposeNoteDown(acc, letter, octs) {
    const commas = (octs.match(/,/g) || []).length;
    const ticks  = (octs.match(/'/g) || []).length;
    if (ticks > 0) {
      // remove one tick
      return acc + letter.toLowerCase() + "'".repeat(ticks - 1);
    } else if (letter === letter.toLowerCase()) {
      // lowercase, no ticks → go to uppercase
      return acc + letter.toUpperCase() + ','.repeat(commas);
    } else {
      // uppercase → add a comma
      return acc + letter.toUpperCase() + ','.repeat(commas + 1);
    }
  }

  // Regex: optional accidental(s), note letter, octave markers
  const NOTE_RE = /([_^=]*)([a-gA-G])([',]*)/g;

  function transformSelection(fn) {
    const s = savedStart, e = savedEnd;
    if (s === e) return;
    pushUndo();
    const before = ta.value.slice(0, s);
    const sel    = ta.value.slice(s, e);
    const after  = ta.value.slice(e);
    const result = fn(sel);
    ta.value   = before + result + after;
    savedStart = s;
    savedEnd   = s + result.length;
    if (taFocused) { ta.focus(); ta.setSelectionRange(savedStart, savedEnd); }
    updateClearBtn();
    schedulePreview();
  }

  // Apply a transform only to the parts of `sel` outside quoted strings "..."
  // Splits into quoted/unquoted segments, applies fn only to unquoted ones.
  function transformSkippingQuotes(sel, fn) {
    return sel.replace(/"[^"]*"|[^"]*/g, token => {
      if (token.startsWith('"')) return token;
      return fn(token);
    });
  }

  function transposeUp() {
    closeMenu();
    transformSelection(sel => transformSkippingQuotes(sel, ch =>
      ch.replace(NOTE_RE, (_, acc, letter, octs) => transposeNoteUp(acc, letter, octs))));
  }

  function transposeDown() {
    closeMenu();
    transformSelection(sel => transformSkippingQuotes(sel, ch =>
      ch.replace(NOTE_RE, (_, acc, letter, octs) => transposeNoteDown(acc, letter, octs))));
  }

  // Note length token: optional multiplier digit(s) OR slash notation
  // e.g. C2 → C4, C → C2, C/ → C, C3/2 → C3 (double: *2 numerator)
  // Halve: C2 → C, C → C/, C/ → C/2 (but C/ means /2 so halving = /4 → use C/4? spec says C/)
  // We handle: bare note, noteN, note/N, noteN/M
  function scaleLengths(sel, multiply) {
    // Match note letter + octave markers, then optional length suffix
    // Length suffix patterns: number, /number, number/number, /  (bare slash = /2)
    return sel.replace(/([a-gA-GzZ][',]*)(\d+\/\d+|\/\d+|\d+|\/)?/g, (match, notePart, len) => {
      if (!len) {
        // implied length 1
        if (multiply) return notePart + '2';
        else          return notePart + '/';
      }
      if (len === '/') {
        // /2 shorthand
        if (multiply) return notePart; // /2 * 2 = 1, back to bare
        else          return notePart + '/2'; // /2 / 2 = /4... spec says use /2 for halving bare, so /2/2 = leave as /2? Use explicit /4
        // Actually: / means /2. Halving /2 → /4
        // But user said halving C → C/. So halving C/ → C/4 seems right.
        // Re-reading: user said halving plain note = C/. So / = /2. Halving that = /4.
      }
      if (len.includes('/') && !len.startsWith('/')) {
        // N/M form
        const [num, den] = len.split('/').map(Number);
        if (multiply) return notePart + (num * 2) + '/' + den;
        else          return notePart + num + '/' + (den * 2);
      }
      if (len.startsWith('/')) {
        // /N form
        const den = parseInt(len.slice(1));
        if (multiply) {
          const newDen = den / 2;
          return newDen === 1 ? notePart : notePart + '/' + newDen;
        } else {
          return notePart + '/' + (den * 2);
        }
      }
      // Plain number
      const n = parseInt(len);
      if (multiply) return notePart + (n * 2);
      else {
        if (n === 1) return notePart + '/';
        if (n % 2 === 0) return notePart + (n / 2 === 1 ? '' : n / 2);
        // odd number: use fraction
        return notePart + n + '/2';
      }
    });
  }

  function doubleLength() {
    closeMenu();
    transformSelection(sel => transformSkippingQuotes(sel, ch => scaleLengths(ch, true)));
  }

  function halveLength() {
    closeMenu();
    transformSelection(sel => transformSkippingQuotes(sel, ch => scaleLengths(ch, false)));
  }

  function removeText() {
    closeMenu();
    // Remove quoted strings (chord symbols / annotations): "..."
    transformSelection(sel => sel.replace(/"[^"]*"/g, ''));
  }

  function removeAccidentals() {
    closeMenu();
    // Strip ^ _ = outside of quoted strings
    transformSelection(sel => {
      let result = '';
      let inQuote = false;
      for (let i = 0; i < sel.length; i++) {
        const ch = sel[i];
        if (ch === '"') { inQuote = !inQuote; result += ch; continue; }
        if (!inQuote && (ch === '^' || ch === '_' || ch === '=')) continue;
        result += ch;
      }
      return result;
    });
  }

  // Enharmonic respelling.
  // For a sharp note (^): step the note name one up; use flat (_) unless the new name
  //   is F or C (already a semitone above E/B), in which case use natural (=).
  // For a flat note (_): step the note name one down; use sharp (^) unless the new name
  //   is E or B (already a semitone below F/C), in which case use natural (=).
  // Unaccidentalled notes and naturals (=) are left unchanged.
  // Octave boundary: stepping up from B enters the next octave (B→c, b→c'…).
  //                  stepping down from C drops one (C→B,, c→B…).

  const NOTE_NAMES = ['C','D','E','F','G','A','B'];

  // Compute integer octave level: 0 = uppercase no markers, 1 = lowercase, etc.
  function noteLevel(letter, octs) {
    const base   = letter === letter.toUpperCase() ? 0 : 1;
    const ticks  = (octs.match(/'/g) || []).length;
    const commas = (octs.match(/,/g) || []).length;
    return base + ticks - commas;
  }

  // Convert note-name index (0–6) + level back to ABC letter + octave markers.
  function levelToAbc(nameIdx, level) {
    const upper = NOTE_NAMES[nameIdx];
    if (level < 1) {
      return { letter: upper, octs: ','.repeat(-level) };
    } else {
      return { letter: upper.toLowerCase(), octs: "'".repeat(level - 1) };
    }
  }

  function respellEnharmonicNote(acc, letter, octs) {
    if (acc !== '^' && acc !== '_') return acc + letter + octs;

    const nameIdx = NOTE_NAMES.indexOf(letter.toUpperCase());
    const level   = noteLevel(letter, octs);

    if (acc === '^') {
      // Step note name one up; B→C crosses into the next octave
      const newIdx   = (nameIdx + 1) % 7;
      const newLevel = newIdx === 0 ? level + 1 : level;
      const newUpper = NOTE_NAMES[newIdx];
      // F and C are naturally a semitone above E and B — no accidental needed
      const newAcc   = (newUpper === 'F' || newUpper === 'C') ? '=' : '_';
      const { letter: nl, octs: no } = levelToAbc(newIdx, newLevel);
      return newAcc + nl + no;
    } else {
      // Step note name one down; C→B drops an octave
      const newIdx   = (nameIdx + 6) % 7;
      const newLevel = newIdx === 6 ? level - 1 : level;
      const newUpper = NOTE_NAMES[newIdx];
      // E and B are naturally a semitone below F and C — no accidental needed
      const newAcc   = (newUpper === 'E' || newUpper === 'B') ? '=' : '^';
      const { letter: nl, octs: no } = levelToAbc(newIdx, newLevel);
      return newAcc + nl + no;
    }
  }

  function wrapRepeats() {
    closeMenu();
    const s = savedStart, e = savedEnd;
    if (s === e) return;
    pushUndo();
    const before = ta.value.slice(0, s);
    const sel    = ta.value.slice(s, e);
    const after  = ta.value.slice(e);
    const open = '|:', close = ':|';
    ta.value = before + open + sel + close + after;
    savedStart = s + open.length;
    savedEnd   = s + open.length + sel.length;
    if (taFocused) { ta.focus(); ta.setSelectionRange(savedStart, savedEnd); }
    updateClearBtn();
    schedulePreview();
    syncDisplayIfUnfocused();
  }
  function markNotes() {
    closeMenu();
    transformSelection(sel => transformSkippingQuotes(sel, ch =>
      ch.replace(NOTE_RE, (match, acc, letter, octs) => '!mark!' + acc + letter + octs)));
  }
  // --- Add triplets tool ---
  // Parse an ABC duration string into a rational number as {num, den}.
  // A bare note (no duration token) has duration 1 (passed as undefined/empty).
  // Rules:
  //   undefined / ''  → 1/1
  //   '/'             → 1/2
  //   '/N'            → 1/N
  //   'N'             → N/1
  //   'N/'            → N/2
  //   'N/M'           → N/M
  function parseDuration(tok) {
    if (!tok) return { num: 1, den: 1 };
    if (tok === '/') return { num: 1, den: 2 };
    if (tok.startsWith('/')) return { num: 1, den: parseInt(tok.slice(1), 10) };
    const slashIdx = tok.indexOf('/');
    if (slashIdx === -1) return { num: parseInt(tok, 10), den: 1 };
    const num = parseInt(tok.slice(0, slashIdx), 10);
    const denStr = tok.slice(slashIdx + 1);
    const den = denStr === '' ? 2 : parseInt(denStr, 10);
    return { num, den };
  }

  // Check if a value (num/den) equals 3 * 2^n for some integer n.
  // Equivalently: (num/den) / 3 = 2^n, i.e. num == 3 * den * 2^k for some integer k,
  // or after simplification num/den in lowest terms has num = 3 * 2^a, den = 2^b.
  function isTripletDuration(num, den) {
    // Simplify num/den
    function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
    const g = gcd(num, den);
    let n = num / g, d = den / g;
    // d must be a power of 2
    while (d % 2 === 0) d /= 2;
    if (d !== 1) return false;
    // n must equal 3 * 2^a
    if (n % 3 !== 0) return false;
    let m = n / 3;
    while (m % 2 === 0) m /= 2;
    return m === 1;
  }

  // Split a selection into groups separated by spaces and/or barlines.
  // Each group is a contiguous run of note/rest tokens (no spaces or barlines).
  // Returns an array of {text: string, start: number, end: number} chunks,
  // where text is the group content (or separator content for spaces/barlines).
  // We process in two passes: first tokenise into notes/rests vs separators.
  function addTriplets() {
    closeMenu();
    const s = savedStart, e = savedEnd;
    if (s === e) return;
    function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

    const val = ta.value;
    const sel = val.slice(s, e);

    // Regex to tokenise ABC selection into meaningful chunks.
    // We identify: barlines, spaces/newlines (separators), and note/rest tokens.
    // A note/rest token: optional decorations, optional chord, optional accidentals,
    //   note letter or rest letter, optional octave markers, optional duration, optional tie.
    // For triplet purposes we mainly need: the note/rest letter + duration suffix.
    // We use a simpler scan: split on spaces and barlines to get groups,
    // then within each group find note/rest tokens.

    const BARLINE_RE = /(?::\|::|::\|:|:\|\|:|:\|\||\|\|:|\|\||::\||::\||\[\|\||:\||:\]|\|\]|\[?\||\|:|::])/;

    // Tokenise the selection into segments: 'sep' (spaces/newlines/barlines) or 'content' (other)
    // We'll split by spaces, newlines, and barlines.
    // Strategy: walk through and collect runs.
    const SEP_RE = new RegExp(
      '(' +
      BARLINE_RE.source +
      '|[ \\t\\n]+' +
      ')', 'g'
    );

    // Build list of segments: {type:'sep'|'content', text, pos}
    const segments = [];
    let lastIdx = 0;
    let m;
    SEP_RE.lastIndex = 0;
    while ((m = SEP_RE.exec(sel)) !== null) {
      if (m.index > lastIdx) {
        segments.push({ type: 'content', text: sel.slice(lastIdx, m.index), pos: lastIdx });
      }
      segments.push({ type: 'sep', text: m[0], pos: m.index });
      lastIdx = m.index + m[0].length;
    }
    if (lastIdx < sel.length) {
      segments.push({ type: 'content', text: sel.slice(lastIdx), pos: lastIdx });
    }

    // For each content segment, decide if it should get a triplet prefix.
    // We need to reconstruct the result with possibly inserted prefixes.
    let result = '';
    for (const seg of segments) {
      if (seg.type === 'sep') {
        result += seg.text;
        continue;
      }

      // Content group: find all note/rest tokens and their durations.
      // Skip decorations, chord symbols, inline fields when counting.
      const group = seg.text;

      // Find note/rest tokens
      // Each match is a note/rest possibly with duration
      const SCAN_RE = new RegExp(
        '"[^"]*"'               + '|' +  // chord symbol — skip
        '![^!\\n]+!'            + '|' +  // decoration — skip
        '\\[[A-Za-z]:[^\\]]*\\]' + '|' + // inline field — skip
        "(?:[_^=]*)(?:[a-gA-G])[,\']*(?:\\d+\\/\\d+|\\d+\\/|\\/\\d+|\\/|\\d+)?-?" + '|' + // note
        '[zxZ](?:\\d+\\/\\d+|\\d+\\/|\\/\\d+|\\/|\\d+)?-?',  // rest
        'g'
      );

      const noteRests = [];
      let sm;
      SCAN_RE.lastIndex = 0;
      while ((sm = SCAN_RE.exec(group)) !== null) {
        const token = sm[0];
        // Skip chord symbols, decorations, inline fields
        if (token.startsWith('"') || token.startsWith('!') || token.startsWith('[')) continue;
        // Extract duration suffix
        // Strip leading accidentals and note letter+octave, or rest letter
        const durMatch = token.match(/^(?:[_^=]*[a-gA-G][',]*|[zxZ])((?:\d+\/\d+|\d+\/|\/\d+|\/|\d+)?)-?$/);
        if (durMatch) {
          noteRests.push({ durTok: durMatch[1] });
        }
      }

      const count = noteRests.length;

      // Skip if fewer than 2 or more than 3
      if (count < 2 || count > 3) {
        result += group;
        continue;
      }

      // Sum durations
      let totalNum = 0, totalDen = 1;
      for (const nr of noteRests) {
        const d = parseDuration(nr.durTok);
        // Add d.num/d.den to totalNum/totalDen
        totalNum = totalNum * d.den + d.num * totalDen;
        totalDen = totalDen * d.den;
        // Simplify
        const g = gcd(Math.abs(totalNum), totalDen);
        totalNum /= g; totalDen /= g;
      }

      // Check if total is a valid triplet duration
      if (!isTripletDuration(totalNum, totalDen)) {
        result += group;
        continue;
      }

      // Add prefix
      if (count === 3) {
        result += '(3' + group;
      } else {
        // count === 2
        result += '(3::2' + group;
      }
    }

    // Apply the result
    pushUndo();
    const before = val.slice(0, s);
    const after  = val.slice(e);
    ta.value   = before + result + after;
    savedStart = s;
    savedEnd   = s + result.length;
    if (taFocused) { ta.focus(); ta.setSelectionRange(savedStart, savedEnd); }
    else syncDisplayIfUnfocused();
    updateClearBtn();
    schedulePreview();
  }

  function respellEnharmonic() {
    closeMenu();
    // NOTE_RE captures (accidentals)(letter)(octave markers) — duration is untouched.
    transformSelection(sel => transformSkippingQuotes(sel, ch =>
      ch.replace(NOTE_RE, (match, acc, letter, octs) =>
        respellEnharmonicNote(acc, letter, octs)
      )
    ));
  }

  // --- Remove redundant accidentals ---
  //
  // An accidental is redundant if, looking back through the same bar, the most recent
  // prior occurrence of the same note+octave that ITSELF carried an explicit accidental
  // had the same accidental as the current one.
  //
  // Special case for natural (=): also redundant if there is NO prior accidentalled
  // occurrence at all in the bar (the natural is not cancelling anything) — UNLESS the
  // piece has a non-trivial key signature, in which case the natural might be cancelling
  // a key-sig accidental and we leave it alone.
  //
  // We detect the key by scanning backwards from the selection for the last K: field.
  // If the key is C / Am / none (zero sharps/flats), or no K: is found, naturals with
  // no prior accidentalled note in the bar are considered redundant.

  function keyHasAccidentals() {
    // Returns true if the current key signature implies any sharps or flats.
    // Scan backwards in the full textarea from savedStart for the last K: field.
    const text = ta.value.slice(0, savedStart);

    // Match both header lines (^K:...) and inline fields ([K:...])
    const KEY_RE = /(?:^|\[)K:([^\]\n]*)/gm;
    let lastKey = null;
    let m;
    KEY_RE.lastIndex = 0;
    const matches = [...text.matchAll(/(?:^|\[)K:([^\]\n]*)/gm)];
    if (matches.length === 0) return false; // no key found → assume C, naturals may be redundant
    lastKey = matches[matches.length - 1][1].trim().toLowerCase();

    // Keys with zero accidentals: C major and its relative/parallel minors declared as such
    const ZERO_ACC = new Set(['c', 'am', 'cmaj', 'aminor', 'amin', 'none', 'c major', 'a minor', 'a min']);
    return !ZERO_ACC.has(lastKey);
  }

  // Barline pattern — same variants as used in addTriplets
  const BARLINE_RE_SRC = '(?:::?\\|::|::\\|:|:\\|\\|:|:\\|\\||\\|\\|:|::\\|\\||::\\|:|:\\||:\\]|\\[\\|\\||\\|\\||\\[\\||\\|\\]|\\||:\\|)';

  function processBarForRedundantAccidentals(bar) {
    // Scan the bar for all note occurrences, tracking positions.
    // We skip content inside quoted strings (chord symbols "...").
    // NOTE_RE: /([_^=]*)([a-gA-G])([',]*)/g

    // Build list of all note hits with their positions in `bar`
    const hits = []; // {index, accLen, acc, letter, octs, noteKey}

    // We need to skip quoted strings. Build a set of ranges to ignore.
    const quotedRanges = [];
    const QUOTE_RE = /"[^"]*"/g;
    let qm;
    while ((qm = QUOTE_RE.exec(bar)) !== null) {
      quotedRanges.push([qm.index, qm.index + qm[0].length]);
    }
    function inQuoted(idx) {
      return quotedRanges.some(([a, b]) => idx >= a && idx < b);
    }

    const SCAN = /([_^=]*)([a-gA-G])([',]*)/g;
    let sm;
    while ((sm = SCAN.exec(bar)) !== null) {
      if (inQuoted(sm.index)) continue;
      const [, acc, letter, octs] = sm;
      hits.push({
        index:   sm.index,
        accLen:  acc.length,
        acc,
        letter,
        octs,
        noteKey: letter + octs,  // includes case and octave markers
      });
    }

    // Forward pass: for each hit, record the "last accidentalled state" for its noteKey
    // at the time we reach it (i.e. from all prior hits in the bar).
    // We also note whether any prior accidentalled occurrence exists at all for that key.
    const stateMap = new Map(); // noteKey → acc string of most recent accidentalled occurrence

    // We'll annotate each hit with {prevAcc, hasPrevAcc} then decide removals.
    const annotated = hits.map(hit => {
      const prevAcc    = stateMap.get(hit.noteKey); // undefined if none seen yet
      const hasPrevAcc = prevAcc !== undefined;
      // Update state if this hit has an accidental
      if (hit.acc !== '') stateMap.set(hit.noteKey, hit.acc);
      return { ...hit, prevAcc, hasPrevAcc };
    });

    // Determine which hits are redundant (working backwards so we can splice safely)
    const toRemove = []; // indices into `bar` where we should remove the accidental prefix
    const noKeyAcc = !keyHasAccidentals();

    for (const h of annotated) {
      if (h.acc === '') continue; // no accidental, nothing to do

      let redundant = false;
      if (h.acc === '=' ) {
        // Natural: redundant if previous accidentalled occurrence was also '=',
        // OR (if key has no accidentals) there was no prior accidentalled occurrence at all.
        if (h.hasPrevAcc && h.prevAcc === '=') redundant = true;
        else if (!h.hasPrevAcc && noKeyAcc)    redundant = true;
      } else {
        // Sharp or flat: redundant only if previous accidentalled occurrence was identical.
        if (h.hasPrevAcc && h.prevAcc === h.acc) redundant = true;
      }

      if (redundant) toRemove.push({ index: h.index, accLen: h.accLen });
    }

    // Apply removals right-to-left so earlier positions aren't disturbed
    toRemove.sort((a, b) => b.index - a.index);
    let result = bar;
    for (const { index, accLen } of toRemove) {
      result = result.slice(0, index) + result.slice(index + accLen);
    }
    return result;
  }

  function removeRedundantAccidentals() {
    closeMenu();
    const BARLINE_RE = new RegExp(BARLINE_RE_SRC, 'g');

    transformSelection(sel => {
      // Split selection into bars (preserving barline tokens) and process each bar segment.
      // We also skip header/field lines (e.g. "T:title\n") by passing them through.
      const FIELD_LINE_RE = /^[A-Za-z]:[^\n]*\n?/gm;

      // Build a list of segments: {type:'field'|'barline'|'music', text, start, end}
      // Strategy: find all barlines and field lines, everything else is music content.
      const splits = []; // {pos, len, type, text}

      // Find field lines
      let fm;
      FIELD_LINE_RE.lastIndex = 0;
      while ((fm = FIELD_LINE_RE.exec(sel)) !== null) {
        splits.push({ pos: fm.index, len: fm[0].length, type: 'field', text: fm[0] });
      }

      // Find barlines
      BARLINE_RE.lastIndex = 0;
      let bm;
      while ((bm = BARLINE_RE.exec(sel)) !== null) {
        // Make sure this barline isn't inside a field line
        const inField = splits.some(s => s.type === 'field' && bm.index >= s.pos && bm.index < s.pos + s.len);
        if (!inField) {
          splits.push({ pos: bm.index, len: bm[0].length, type: 'barline', text: bm[0] });
        }
      }

      // Sort by position
      splits.sort((a, b) => a.pos - b.pos);

      // Walk through `sel`, collecting music segments between the splits
      let result = '';
      let cursor = 0;
      for (const sp of splits) {
        if (sp.pos > cursor) {
          // Music content before this split — process it as a bar segment
          result += processBarForRedundantAccidentals(sel.slice(cursor, sp.pos));
        }
        result += sp.text;
        cursor = sp.pos + sp.len;
      }
      // Trailing music segment after last split
      if (cursor < sel.length) {
        result += processBarForRedundantAccidentals(sel.slice(cursor));
      }
      return result;
    });
  }

  // --- Chord popup ---
  let popupPrevFocused = false;
  let popupOpen = false;

  function openChordPopup() {
    document.getElementById('chordInput').value = '';
    document.getElementById('chordOverlay').classList.add('open');
    document.getElementById('chordInput').focus();
  }
  function closeChordPopup() {
    popupOpen = false;
    document.getElementById('chordOverlay').classList.remove('open');
    if (popupPrevFocused) {
      hideStaticDisplay();
      ta.focus();
      ta.setSelectionRange(savedStart, savedEnd);
    } else {
      showStaticDisplay();
    }
  }
  function doneChordPopup() {
    const val = document.getElementById('chordInput').value;
    closeChordPopup();
    if (!val) return;
    doInsert('"' + val + '"', popupPrevFocused);
  }
  document.getElementById('chordOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('chordOverlay')) closeChordPopup();
  });
  document.getElementById('chordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); doneChordPopup(); }
    if (e.key === 'Escape') closeChordPopup();
  });

  // --- Text popup ---
  let textPopupPos = 'above';
  function openTextPopup(pos) {
    textPopupPos = pos;
    document.getElementById('textInput').value = '';
    document.getElementById('textPopupTitle').textContent = pos === 'above' ? 'Add text above staff' : 'Add text below staff';
    document.getElementById('textOverlay').classList.add('open');
    document.getElementById('textInput').focus();
  }
  function openTextPopupAbove() { openTextPopup('above'); }
  function openTextPopupBelow() { openTextPopup('below'); }
  function closeTextPopup() {
    popupOpen = false;
    document.getElementById('textOverlay').classList.remove('open');
    if (popupPrevFocused) {
      hideStaticDisplay();
      ta.focus();
      ta.setSelectionRange(savedStart, savedEnd);
    } else {
      showStaticDisplay();
    }
  }
  function doneTextPopup() {
    const val = document.getElementById('textInput').value;
    closeTextPopup();
    if (!val) return;
    const prefix = textPopupPos === 'above' ? '^' : '_';
    doInsert('"' + prefix + val + '"', popupPrevFocused);
  }
  document.getElementById('textOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('textOverlay')) closeTextPopup();
  });
  document.getElementById('textInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); doneTextPopup(); }
    if (e.key === 'Escape') closeTextPopup();
  });

  // Unified button interaction — works for both touch and mouse
  const actions = { undo, toggleMenu, toggleZoom, openSettings, copyText, copyTextRaw, toggleCopyDropdown, resetStep1, clearStep2, clearCancel, bksp, arrowLeft, arrowRight, arrowUp, arrowDown, transposeUp, transposeDown, doubleLength, halveLength, removeText, removeAccidentals, respellEnharmonic, wrapRepeats, markNotes, addTriplets, removeRedundantAccidentals, openChordPopup, closeChordPopup, doneChordPopup, openTextPopupAbove, openTextPopupBelow, closeTextPopup, doneTextPopup, openTmplOverlay, closeTmplOverlay };

  const releaseActions = new Set(['copyText', 'copyTextRaw', 'toggleCopyDropdown', 'toggleMenu', 'toggleZoom', 'openSettings', 'resetStep1', 'clearStep2', 'clearCancel', 'openChordPopup', 'openTextPopupAbove', 'openTextPopupBelow', 'openTmplOverlay', 'closeTmplOverlay', 'undo']);

  function handleButtonPress(btn) {
    // Release-action buttons animate on release, not press
    if (!releaseActions.has(btn.dataset.action)) {
      btn.classList.remove('flash');
      void btn.offsetWidth;
      btn.classList.add('flash');
    }
    if (releaseActions.has(btn.dataset.action)) return;
    // Fire all other actions immediately on press
    if (btn.dataset.action) {
      const fn = actions[btn.dataset.action];
      if (fn) fn();
    } else if (btn.dataset.insert !== undefined) {
      const isKey = btn.classList.contains('key');
      if (btn.classList.contains('tmpl-btn')) {
        closeTmplOverlay();
        doInsert(btn.dataset.insert, taFocused);
      } else {
        doInsert(btn.dataset.insert, isKey && taFocused);
      }
    }
  }

  function handleButtonRelease(btn) {
    if (btn.dataset.action && releaseActions.has(btn.dataset.action)) {
      btn.classList.remove('flash');
      void btn.offsetWidth;
      btn.classList.add('flash');
      const fn = actions[btn.dataset.action];
      if (fn) fn();
    }
  }

  // ---- Gesture system for note-letter keys (A-G, a-g) ----
  const OCTAVE_PX   = 40;
  const MAX_OCTAVE  = 3;
  const H_THRESHOLD = 40;
  const WHEEL_DELAY = 180;

  function isNoteKey(btn) {
    return btn && btn.dataset.insert && /^[a-gA-G]$/.test(btn.dataset.insert);
  }

  const wheel  = document.getElementById('gesture-wheel');
  const badge  = document.getElementById('gesture-badge');
  const chevGrps = {
    up:    document.getElementById('chev-up-g'),
    down:  document.getElementById('chev-down-g'),
    left:  document.getElementById('chev-left-g'),
    right: document.getElementById('chev-right-g'),
  };

  function setChevState(grp, active) {
    const path = grp.querySelector('.chev-path');
    path.classList.toggle('dim',    !active);
    path.classList.toggle('bright',  active);
  }

  function nudgeChev(grp, reverse) {
    const cls = reverse ? 'nudge-rev' : 'nudge';
    grp.classList.remove('nudge', 'nudge-rev');
    void grp.getBoundingClientRect();
    grp.classList.add(cls);
    grp.addEventListener('animationend', () => grp.classList.remove(cls), { once: true });
  }

  Object.values(chevGrps).forEach(g => setChevState(g, false));

  function showWheel(x, y) {
    wheel.style.left = x + 'px';
    wheel.style.top  = y + 'px';
    wheel.classList.add('visible');
    Object.values(chevGrps).forEach(g => setChevState(g, false));
  }

  function hideWheel() {
    wheel.classList.remove('visible');
    badge.classList.remove('visible');
  }

  function updateBadge(note, x, y) {
    badge.textContent = note;
    badge.style.left = x + 'px';
    badge.style.top  = y + 'px';
  }

  let prevOctaveSteps = 0;
  let prevHDir = 0;

  function onNoteChange(dx, dy) {
    const octaveSteps = Math.min(MAX_OCTAVE, Math.floor(Math.abs(dy) / OCTAVE_PX));
    const goingUp    = dy < 0 && octaveSteps > 0;
    const goingDown  = dy > 0 && octaveSteps > 0;
    const goingLeft  = dx <= -H_THRESHOLD;
    const goingRight = dx >= H_THRESHOLD;
    const hDir = goingLeft ? -1 : goingRight ? 1 : 0;

    setChevState(chevGrps.up,    goingUp);
    setChevState(chevGrps.down,  goingDown);
    setChevState(chevGrps.left,  goingLeft);
    setChevState(chevGrps.right, goingRight);

    if (octaveSteps !== prevOctaveSteps) {
      const decreasing = octaveSteps < prevOctaveSteps;
      if (octaveSteps > 0) nudgeChev(dy < 0 ? chevGrps.up : chevGrps.down, decreasing);
      prevOctaveSteps = octaveSteps;
    }
    if (hDir !== prevHDir) {
      if (hDir === -1) nudgeChev(chevGrps.left);
      if (hDir ===  1) nudgeChev(chevGrps.right);
      prevHDir = hDir;
    }
  }

  function noteFromGesture(baseLetter, dx, dy) {
    const octaveSteps = Math.min(MAX_OCTAVE, Math.floor(Math.abs(dy) / OCTAVE_PX));
    const goingUp = dy < 0;
    let note, octaveStr = '';
    if (goingUp) {
      note = octaveSteps === 0 ? baseLetter.toUpperCase() : baseLetter.toLowerCase();
      octaveStr = octaveSteps > 1 ? "'".repeat(octaveSteps - 1) : '';
    } else {
      note = baseLetter.toUpperCase();
      octaveStr = octaveSteps > 0 ? ','.repeat(octaveSteps) : '';
    }
    const accidental = dx >= H_THRESHOLD ? '^' : dx <= -H_THRESHOLD ? '_' : '';
    return accidental + note + octaveStr;
  }

  let gesture = null;

  function startGesture(btn, startX, startY) {
    pushUndo();
    const baseLetter = btn.dataset.insert;
    const insertPos  = savedStart;
    const insertEnd  = savedEnd;
    const initial    = baseLetter.toUpperCase();

    ta.value   = ta.value.slice(0, insertPos) + initial + ta.value.slice(insertEnd);
    savedStart = insertPos + initial.length;
    savedEnd   = savedStart;
    if (taFocused) ta.setSelectionRange(savedStart, savedEnd);
    else syncDisplayIfUnfocused();
    updateClearBtn();
    schedulePreview();

    btn.classList.add('pressed');

    const rect  = btn.getBoundingClientRect();
    const btnCX = rect.left + rect.width  / 2;
    const btnCY = rect.top  + rect.height / 2;

    prevOctaveSteps = 0;
    prevHDir = 0;

    const wheelTimer = setTimeout(() => {
      if (gesture) showWheel(btnCX, btnCY);
    }, WHEEL_DELAY);

    gesture = { btn, baseLetter, insertPos, startX, startY, lastNote: initial, wheelTimer, curX: startX, curY: startY };
  }

  function updateGesture(currentX, currentY) {
    if (!gesture) return;
    gesture.curX = currentX;
    gesture.curY = currentY;
    const dx   = currentX - gesture.startX;
    const dy   = currentY - gesture.startY;
    const note = noteFromGesture(gesture.baseLetter, dx, dy);
    if (note !== gesture.lastNote) {
      const start = gesture.insertPos;
      const end   = start + gesture.lastNote.length;
      ta.value   = ta.value.slice(0, start) + note + ta.value.slice(end);
      savedStart = start + note.length;
      savedEnd   = savedStart;
      if (taFocused) ta.setSelectionRange(savedStart, savedEnd);
      else syncDisplayIfUnfocused();
      gesture.lastNote = note;
      updateClearBtn();
      schedulePreview();
      if (wheel.classList.contains('visible')) {
        onNoteChange(dx, dy);
        badge.classList.add('visible');
      }
    }
    if (badge.classList.contains('visible')) updateBadge(gesture.lastNote, currentX, currentY);
  }

  function endGesture() {
    if (!gesture) return;
    clearTimeout(gesture.wheelTimer);
    hideWheel();
    const btn = gesture.btn;
    btn.classList.remove('pressed', 'shrink');
    void btn.offsetWidth;
    btn.classList.add('shrink');
    gesture = null;
  }

  // Touch move — new listener needed for gesture dragging
  document.addEventListener('touchmove', e => {
    if (!gesture) return;
    e.preventDefault();
    updateGesture(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  }, { passive: false });

  // Touch handling — press on touchstart, fire on touchend
  let activeBtn = null;
  document.addEventListener('touchstart', e => {
    const btn = e.target.closest('.key, .tmpl-btn, .action-btn');
    if (!btn) return;

    if (isNoteKey(btn)) {
      e.preventDefault();
      activeBtn = null; // gesture system takes over
      startGesture(btn, e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      return;
    }

    if (btn.classList.contains('key') || btn.classList.contains('tmpl-btn') || btn.dataset.keepfocus) {
      e.preventDefault();
    }
    const action = btn.dataset.action;
    if (action === 'openChordPopup' || action === 'openTextPopupAbove' || action === 'openTextPopupBelow') {
      popupPrevFocused = taFocused;
      popupOpen = true;
    }
    activeBtn = btn;
    handleButtonPress(btn);
  }, { passive: false });

  document.addEventListener('touchend', e => {
    if (gesture) {
      endGesture();
      e.preventDefault();
      return;
    }
    if (!activeBtn) return;
    const touch = e.changedTouches[0];
    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    if (target && activeBtn.contains(target)) handleButtonRelease(activeBtn);
    activeBtn = null;
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchcancel', e => {
    if (gesture) { endGesture(); return; }
    activeBtn = null;
  }, { passive: true });

  // Mouse handling
  let activeMouseBtn = null;

  document.addEventListener('mousedown', e => {
    const btn = e.target.closest('.key, .tmpl-btn, .action-btn');
    if (!btn) return;

    if (isNoteKey(btn)) {
      e.preventDefault();
      activeMouseBtn = null;
      startGesture(btn, e.clientX, e.clientY);
      return;
    }

    if (btn.classList.contains('key') || btn.classList.contains('tmpl-btn') || btn.dataset.keepfocus) {
      e.preventDefault();
    }
    const action = btn.dataset.action;
    if (action === 'openChordPopup' || action === 'openTextPopupAbove' || action === 'openTextPopupBelow') {
      popupPrevFocused = taFocused;
      popupOpen = true;
    }
    activeMouseBtn = btn;
    handleButtonPress(btn);
  });

  document.addEventListener('mousemove', e => {
    if (!gesture) return;
    updateGesture(e.clientX, e.clientY);
  });

  document.addEventListener('mouseup', e => {
    if (gesture) { endGesture(); return; }
    if (!activeMouseBtn) return;
    const btn = activeMouseBtn;
    activeMouseBtn = null;
    if (btn.contains(e.target)) handleButtonRelease(btn);
  });
</script>
</body>
</html>
