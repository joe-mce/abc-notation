<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ABC Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #333;
    --accent: #e8c84a;
    --text: #f0ede6;
    --text-dim: #888;
    --btn-bg: #222;
    --btn-border: #3a3a3a;
    --radius: 8px;
    --radius-sm: 5px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 10px;
    gap: 7px;
    max-width: 640px;
    margin: 0 auto;
  }

  #notation {
    width: 100%;
    min-height: 120px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
    line-height: 1.6;
    padding: 10px 12px;
    resize: vertical;
    caret-color: var(--accent);
    outline: none;
  }
  #notation::placeholder { color: var(--text-dim); }

  .key-row {
    display: flex;
    gap: 4px;
    width: 100%;
    padding: 0 32px;
  }

  .key {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 1rem;
    border: 1.5px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--text);
    border-radius: var(--radius-sm);
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 48px;
    flex: 1 1 0;
    touch-action: manipulation;
  }

  @keyframes keyshrink {
    0%   { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .key { transition: transform 0.0s; }
  .key.pressed { transform: scale(1.18); z-index: 10; position: relative; }
  .key.shrink { animation: keyshrink 0.2s cubic-bezier(0.2, 0, 0.4, 1); }

  /* Gesture chevrons — single SVG */
  #gesture-wheel {
    display: none;
    position: fixed;
    width: 200px;
    height: 200px;
    transform: translate(-50%, -50%);
    z-index: 100;
    pointer-events: none;
  }
  #gesture-wheel.visible { display: block; }

  .chev-path {
    fill: none;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .chev-path.dim    { stroke: rgba(255,255,255,0.2); }
  .chev-path.bright { stroke: rgba(255,255,255,0.82); }

  @keyframes nudge-up    { 0%{transform:translateY(0)} 35%{transform:translateY(-5px)} 100%{transform:translateY(0)} }
  @keyframes nudge-down  { 0%{transform:translateY(0)} 35%{transform:translateY( 5px)} 100%{transform:translateY(0)} }
  @keyframes nudge-left  { 0%{transform:translateX(0)} 35%{transform:translateX(-5px)} 100%{transform:translateX(0)} }
  @keyframes nudge-right { 0%{transform:translateX(0)} 35%{transform:translateX( 5px)} 100%{transform:translateX(0)} }

  @keyframes nudge-up-rev    { 0%{transform:translateY(0)} 35%{transform:translateY( 5px)} 100%{transform:translateY(0)} }
  @keyframes nudge-down-rev  { 0%{transform:translateY(0)} 35%{transform:translateY(-5px)} 100%{transform:translateY(0)} }
  @keyframes nudge-left-rev  { 0%{transform:translateX(0)} 35%{transform:translateX( 5px)} 100%{transform:translateX(0)} }
  @keyframes nudge-right-rev { 0%{transform:translateX(0)} 35%{transform:translateX(-5px)} 100%{transform:translateX(0)} }

  #chev-up-g.nudge      { animation: nudge-up        0.32s cubic-bezier(0.2,0,0.4,1); }
  #chev-down-g.nudge    { animation: nudge-down      0.32s cubic-bezier(0.2,0,0.4,1); }
  #chev-left-g.nudge    { animation: nudge-left      0.32s cubic-bezier(0.2,0,0.4,1); }
  #chev-right-g.nudge   { animation: nudge-right     0.32s cubic-bezier(0.2,0,0.4,1); }
  #chev-up-g.nudge-rev    { animation: nudge-up-rev    0.32s cubic-bezier(0.2,0,0.4,1); }
  #chev-down-g.nudge-rev  { animation: nudge-down-rev  0.32s cubic-bezier(0.2,0,0.4,1); }
  #chev-left-g.nudge-rev  { animation: nudge-left-rev  0.32s cubic-bezier(0.2,0,0.4,1); }
  #chev-right-g.nudge-rev { animation: nudge-right-rev 0.32s cubic-bezier(0.2,0,0.4,1); }
</style>
</head>
<body>

<textarea id="notation" placeholder="Type or tap…"
  autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

<div class="key-row">
  <button class="key" data-insert="C">C</button>
  <button class="key" data-insert="D">D</button>
  <button class="key" data-insert="E">E</button>
  <button class="key" data-insert="F">F</button>
  <button class="key" data-insert="G">G</button>
  <button class="key" data-insert="A">A</button>
  <button class="key" data-insert="B">B</button>
</div>

<div id="gesture-wheel">
  <!-- SVG viewBox 200x200, centre at 100,100, chevrons on a circle of radius 78px -->
  <!-- Chevron span ±28px, depth 14px toward centre -->
  <svg viewBox="0 0 200 200" width="200" height="200" overflow="visible">
    <!-- Up: apex at (100,22), arms at (72,36) and (128,36) -->
    <g id="chev-up-g">
      <polyline class="chev-path dim" points="72,36 100,22 128,36"/>
    </g>
    <!-- Down: apex at (100,178), arms at (72,164) and (128,164) -->
    <g id="chev-down-g">
      <polyline class="chev-path dim" points="72,164 100,178 128,164"/>
    </g>
    <!-- Left: apex at (22,100), arms at (36,72) and (36,128) -->
    <g id="chev-left-g">
      <polyline class="chev-path dim" points="36,72 22,100 36,128"/>
    </g>
    <!-- Right: apex at (178,100), arms at (164,72) and (164,128) -->
    <g id="chev-right-g">
      <polyline class="chev-path dim" points="164,72 178,100 164,128"/>
    </g>
  </svg>
</div>

<script>
  const ta = document.getElementById('notation');
  let taFocused = false;
  let savedStart = 0, savedEnd = 0;

  ta.addEventListener('focus', () => { taFocused = true; });
  ta.addEventListener('blur', () => {
    taFocused = false;
    savedStart = ta.selectionStart;
    savedEnd = ta.selectionEnd;
  });
  document.addEventListener('selectionchange', () => {
    if (taFocused) { savedStart = ta.selectionStart; savedEnd = ta.selectionEnd; }
  });

  // --- Gesture state ---
  const OCTAVE_PX = 40;
  const MAX_OCTAVE = 3;
  const H_THRESHOLD = 40;
  const WHEEL_DELAY = 180; // ms before wheel appears

  const wheel = document.getElementById('gesture-wheel');
  const chevGrps = {
    up:    document.getElementById('chev-up-g'),
    down:  document.getElementById('chev-down-g'),
    left:  document.getElementById('chev-left-g'),
    right: document.getElementById('chev-right-g'),
  };

  function setChevState(grp, active) {
    const path = grp.querySelector('.chev-path');
    path.classList.toggle('dim',    !active);
    path.classList.toggle('bright',  active);
  }

  function nudgeChev(grp, reverse) {
    const cls = reverse ? 'nudge-rev' : 'nudge';
    grp.classList.remove('nudge', 'nudge-rev');
    void grp.getBoundingClientRect();
    grp.classList.add(cls);
    grp.addEventListener('animationend', () => grp.classList.remove(cls), { once: true });
  }

  function initChevrons() {
    Object.values(chevGrps).forEach(g => setChevState(g, false));
  }
  initChevrons();

  function showWheel(x, y) {
    wheel.style.left = x + 'px';
    wheel.style.top  = y + 'px';
    wheel.classList.add('visible');
    Object.values(chevGrps).forEach(g => setChevState(g, false));
  }

  function hideWheel() {
    wheel.classList.remove('visible');
  }

  let prevOctaveSteps = 0;
  let prevHDir = 0;

  function onNoteChange(dx, dy) {
    const octaveSteps = Math.min(MAX_OCTAVE, Math.floor(Math.abs(dy) / OCTAVE_PX));
    const goingUp    = dy < 0 && octaveSteps > 0;
    const goingDown  = dy > 0 && octaveSteps > 0;
    const goingLeft  = dx <= -H_THRESHOLD;
    const goingRight = dx >= H_THRESHOLD;
    const hDir = goingLeft ? -1 : goingRight ? 1 : 0;

    setChevState(chevGrps.up,    goingUp);
    setChevState(chevGrps.down,  goingDown);
    setChevState(chevGrps.left,  goingLeft);
    setChevState(chevGrps.right, goingRight);

    if (octaveSteps !== prevOctaveSteps) {
      const decreasing = octaveSteps < prevOctaveSteps;
      if (octaveSteps > 0) nudgeChev(dy < 0 ? chevGrps.up : chevGrps.down, decreasing);
      // if octaveSteps === 0, just dim — no animation
      prevOctaveSteps = octaveSteps;
    }

    if (hDir !== prevHDir) {
      if (hDir === -1) nudgeChev(chevGrps.left);
      if (hDir ===  1) nudgeChev(chevGrps.right);
      prevHDir = hDir;
    }
  }

  let gesture = null;

  function noteFromGesture(baseLetter, dx, dy) {
    // dy: negative = up = higher octave, positive = down = lower octave
    const octaveSteps = Math.min(MAX_OCTAVE, Math.floor(Math.abs(dy) / OCTAVE_PX));
    const goingUp = dy < 0;

    // Base is uppercase C D E F G A B
    // Up from uppercase: lowercase, then add '
    // Down from uppercase: add ,
    let note = baseLetter; // always uppercase base
    let octaveStr = '';
    if (goingUp) {
      if (octaveSteps === 0) {
        note = baseLetter.toUpperCase();
      } else {
        // 1 step up = lowercase, 2 = lowercase + ', 3 = lowercase + ''
        note = baseLetter.toLowerCase();
        octaveStr = octaveSteps > 1 ? "'".repeat(octaveSteps - 1) : '';
      }
    } else {
      // 0 steps = uppercase, 1+ = uppercase + ,
      note = baseLetter.toUpperCase();
      octaveStr = octaveSteps > 0 ? ','.repeat(octaveSteps) : '';
    }

    // Horizontal: sharp or flat — use same threshold logic as onNoteChange
    const accidental = dx >= H_THRESHOLD ? '^' : dx <= -H_THRESHOLD ? '_' : '';

    return accidental + note + octaveStr;
  }

  function startGesture(btn, startX, startY) {
    const baseLetter = btn.dataset.insert;
    const insertPos = savedStart;
    const insertEnd = savedEnd;

    const initial = baseLetter.toUpperCase();
    ta.value = ta.value.slice(0, insertPos) + initial + ta.value.slice(insertEnd);
    savedStart = insertPos + initial.length;
    savedEnd = savedStart;
    if (taFocused) ta.setSelectionRange(savedStart, savedEnd);

    btn.classList.add('pressed');
    btn.textContent = initial;

    // Get button centre for wheel positioning
    const rect = btn.getBoundingClientRect();
    const btnCX = rect.left + rect.width / 2;
    const btnCY = rect.top  + rect.height / 2;

    const wheelTimer = setTimeout(() => {
      if (gesture) showWheel(btnCX, btnCY);
    }, WHEEL_DELAY);

    prevOctaveSteps = 0;
    prevHDir = 0;

    gesture = {
      btn,
      baseLetter,
      insertPos,
      startX,
      startY,
      lastNote: initial,
      wheelTimer,
      wheelVisible: false,
    };
  }

  function updateGesture(currentX, currentY) {
    if (!gesture) return;
    const dx = currentX - gesture.startX;
    const dy = currentY - gesture.startY;
    const note = noteFromGesture(gesture.baseLetter, dx, dy);

    if (note !== gesture.lastNote) {
      const start = gesture.insertPos;
      const end = start + gesture.lastNote.length;
      ta.value = ta.value.slice(0, start) + note + ta.value.slice(end);
      savedStart = start + note.length;
      savedEnd = savedStart;
      if (taFocused) ta.setSelectionRange(savedStart, savedEnd);
      gesture.btn.textContent = note;
      gesture.lastNote = note;
      if (wheel.classList.contains('visible')) onNoteChange(dx, dy);
    }
  }

  function endGesture() {
    if (!gesture) return;
    clearTimeout(gesture.wheelTimer);
    hideWheel();
    const btn = gesture.btn;
    btn.classList.remove('pressed');
    btn.classList.remove('shrink');
    void btn.offsetWidth;
    btn.classList.add('shrink');
    btn.textContent = gesture.baseLetter.toUpperCase();
    gesture = null;
  }

  // --- Touch ---
  document.addEventListener('touchstart', e => {
    const btn = e.target.closest('.key');
    if (!btn) return;
    e.preventDefault();
    const t = e.changedTouches[0];
    startGesture(btn, t.clientX, t.clientY);
  }, { passive: false });

  document.addEventListener('touchmove', e => {
    if (!gesture) return;
    e.preventDefault();
    const t = e.changedTouches[0];
    updateGesture(t.clientX, t.clientY);
  }, { passive: false });

  document.addEventListener('touchend', e => {
    endGesture();
    e.preventDefault();
  }, { passive: false });

  // --- Mouse ---
  let mouseDown = false;
  document.addEventListener('mousedown', e => {
    const btn = e.target.closest('.key');
    if (!btn) return;
    e.preventDefault();
    mouseDown = true;
    startGesture(btn, e.clientX, e.clientY);
  });

  document.addEventListener('mousemove', e => {
    if (!mouseDown || !gesture) return;
    updateGesture(e.clientX, e.clientY);
  });

  document.addEventListener('mouseup', e => {
    if (!mouseDown) return;
    mouseDown = false;
    endGesture();
  });
</script>
</body>
</html>
